name: Daily Keiba AI Predictor

on:
  schedule:
    # 毎日 日本時間 17:15（UTC 08:15）に自動実行
    - cron: '15 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 必要なライブラリのインストール
        run: |
          pip install google-genai requests beautifulsoup4

      - name: レースデータ収集・Gemini推論の実行
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          python scripts/collect_races.py

      - name: 更新データの自動コミットとプッシュ
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/today.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto Update: 本日・翌日レース予想データ更新" && git push)
