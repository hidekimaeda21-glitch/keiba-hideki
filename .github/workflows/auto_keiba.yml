name: Daily Keiba AI Predictor

on:
  schedule:
    # 毎週金曜日・土曜日 17:00(JST) = UTC 8:00 に翌日の予想を自動生成
    - cron: '0 8 * * 5,6'
    # 毎週土曜日・日曜日 17:45(JST) = UTC 8:45 に当日の結果収集・成績集計
    - cron: '45 8 * * 0,6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas google-genai

      - name: ジェミ予想・データ収集スクリプトの実行
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/collect_races.py

      - name: レース結果収集・成績集計スクリプトの実行
        run: |
          python scripts/collect_results.py

      - name: 生成データをコミット＆プッシュ
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/today.json data/history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update AI prediction and history [skip ci]" && git push)
