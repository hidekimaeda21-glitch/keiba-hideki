name: Auto Keiba AI Predictor

on:
  schedule:
    - cron: '18 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 google-genai

      - name: Run race collection script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          python scripts/collect_races.py

      - name: Commit and push updated data
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add -f data/today.json data/stats.json data/horses_db.json
          git commit -m "Update race data $(date +'%Y-%m-%d %H:%M')" || echo "No changes to commit"
          git pull --rebase -X theirs origin main || true
          git push origin HEAD:main --force
