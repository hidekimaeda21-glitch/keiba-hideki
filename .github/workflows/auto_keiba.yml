name: Auto Keiba AI Predictor

on:
  schedule:
    # 金・土・日の夜 20:00〜20:55 (JST) ＝ UTC 11時台を5分おきに試行
    - cron: '*/5 11 * * 5,6,0'
    # 土・日・月の朝 08:00〜08:55 (JST) ＝ UTC 23時台を5分おきに試行
    - cron: '*/5 23 * * 5,6,0'
    # 土・日・月の午前 09:00〜11:55 (JST) ＝ UTC 0,1,2時台を5分おきに試行
    - cron: '*/5 0,1,2 * * 6,0,1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-predictions:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのコードを取得（全履歴を含む）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 直近45分以内に更新済みかチェック（自動実行時のみ）
        id: check_recent
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 -c 'import json,datetime,os; JST=datetime.timezone(datetime.timedelta(hours=9)); d=json.load(open("data/today.json",encoding="utf-8")) if os.path.exists("data/today.json") else {}; u=d.get("updatedAt",""); diff=(datetime.datetime.now(JST)-datetime.datetime.strptime(u,"%Y-%m-%d %H:%M").replace(tzinfo=JST)).total_seconds() if u else 9999; skip="true" if 0<=diff<2700 else "false"; print(f"updatedAt={u}, diff={int(diff)}s, skip={skip}"); open(os.environ["GITHUB_OUTPUT"],"a").write(f"skip={skip}\n")'

      - name: Pythonのセットアップ
        if: steps.check_recent.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 必要なライブラリのインストール
        if: steps.check_recent.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: AI予想データ (today.json / stats.json) の生成・計算
        if: steps.check_recent.outputs.skip != 'true'
        run: |
          python scripts/collect_races.py

      - name: 生成された全データファイルをGitHubへ自動保存・公開
        if: steps.check_recent.outputs.skip != 'true'
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git pull --rebase origin main || true
          git add data/today.json today.json data/stats.json stats.json index.html || true
          git diff --staged --quiet || (git commit -m "Update AI predictions, markStats & WIN5" && git push)
