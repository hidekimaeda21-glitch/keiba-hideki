name: Auto Keiba AI Predictor

on:
  schedule:
    - cron: '0 11 * * 5,6' # 金曜・土曜 JST 20:00 (出馬表初期クローリング)
    - cron: '30 23 * * 5,6' # 土曜・日曜 JST 08:30 (直前オッズ更新)
    - cron: '30 8 * * 0,1'  # 日曜・月曜 JST 17:30 (レース確定後学習・成績集計)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 google-genai

      - name: Run Prediction & Stats Collection
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          python scripts/collect_races.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto update predictions and stats"
          git push
