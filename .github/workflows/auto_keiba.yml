name: Auto Keiba AI Predictor

on:
  schedule:
    # 1. 金曜・土曜の夜 20:00 (日本時間) ＝ UTC 11:00 (金・土) に前日予想を自動更新
    - cron: '0 11 * * 5,6'
    # 2. 土曜・日曜の朝 08:30 (日本時間) ＝ UTC 23:30 (金・土) に当日朝の最新オッズで自動更新
    - cron: '30 23 * * 5,6'
    # 3. 土曜・日曜の昼 12:30 (日本時間) ＝ UTC 03:30 (土・日) に9R〜12R＆WIN5直前オッズで自動更新
    - cron: '30 3 * * 6,0'
  workflow_dispatch: # 手動実行ボタン (Run workflow) も引き続き使えます

permissions:
  contents: write

jobs:
  update-predictions:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのコードを取得
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 必要なライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: AI予想データ (today.json) の生成・計算
        run: |
          python scripts/collect_races.py

      - name: 生成された today.json をGitHubへ自動保存・公開
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git pull --rebase origin main || true
          git add data/today.json today.json || true
          git diff --staged --quiet || (git commit -m "Auto update AI predictions (1,000 yen fixed & WIN5)" && git push)
