name: Daily Keiba AI Predictor

on:
  schedule:
    # 毎週金曜・土曜の日本時間 20:00 (UTC 11:00) ➔ 翌日レースの前日確定オッズで予想生成
    - cron: '0 11 * * 5,6'
    # 毎週土曜・日曜の日本時間 08:30 (UTC 前日23:30) ➔ 当日レースの最新オッズで直前更新
    - cron: '30 23 * * 5,6'
  workflow_dispatch: # 手動実行ボタンも常時利用可能

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 必要なライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 google-genai

      - name: レースデータ収集・Gemini推論の実行
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          python scripts/collect_races.py

      - name: 更新データの自動コミットとプッシュ
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/today.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update race predictions [skip ci]" && git push)
