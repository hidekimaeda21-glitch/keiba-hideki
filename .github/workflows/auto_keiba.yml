name: Auto Keiba AI Predictor

on:
  schedule:
    # 1. 金曜・土曜・日曜の夜 20:17 (日本時間) ＝ UTC 11:17 (金・土・日) に前日予想を自動更新
    - cron: '17 11 * * 5,6,0'
    # 2. 土曜・日曜・月曜の朝 08:37 (日本時間) ＝ UTC 23:37 (金・土・日) に当日朝の最新オッズで自動更新
    - cron: '37 23 * * 5,6,0'
    # 3. 土曜・日曜・月曜の朝 10:27 (日本時間) ＝ UTC 01:27 (土・日・月) に9R〜12R＆WIN5直前オッズで自動更新（10:30頃反映）
    - cron: '27 1 * * 6,0,1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-predictions:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのコードを取得（全履歴を含む）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 必要なライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: AI予想データ (today.json / stats.json) の生成・計算
        run: |
          python scripts/collect_races.py

      - name: 生成された全データファイルをGitHubへ自動保存・公開
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git pull --rebase origin main || true
          git add data/today.json today.json data/stats.json stats.json index.html || true
          git diff --staged --quiet || (git commit -m "Update AI predictions, markStats & WIN5" && git push)
