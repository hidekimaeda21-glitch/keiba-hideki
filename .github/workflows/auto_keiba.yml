name: Daily Keiba AI Predictor

on:
  schedule:
    # 毎朝6:30(JST) = UTC 21:30 に自動実行
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas google-generativeai

      - name: ジェミ予想・データ収集スクリプトの実行
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/collect_races.py

      - name: 生成データをコミット＆プッシュ
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/today.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update AI prediction [skip ci]" && git push)
