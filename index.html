<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ジェミ予想 AI Predictor</title>
  <style>
    :root {
      --bg-color: #0f1015;
      --card-bg: #171822;
      --accent-color: #3b82f6;
      --gold-color: #ffd700;
      --green-color: #10b981;
      --red-color: #ef4444;
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --border-color: #27273a;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 12px;
      padding-bottom: 60px;
    }
    header {
      text-align: center;
      padding: 16px 0 12px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 12px;
      position: relative;
    }
    h1 {
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .update-time {
      font-size: 11px;
      color: var(--text-sub);
      margin-top: 4px;
    }
    .reload-btn {
      position: absolute;
      right: 4px;
      top: 18px;
      background: #27273a;
      color: #3b82f6;
      border: 1px solid #3b82f6;
      border-radius: 6px;
      font-size: 11px;
      padding: 4px 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .stats-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    .stat-card {
      flex: 1;
      background: linear-gradient(145deg, #181926, #12131d);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.1s, border-color 0.2s;
    }
    .stat-card:active {
      transform: scale(0.98);
      border-color: #3b82f6;
    }
    .stat-label {
      font-size: 10px;
      color: var(--text-sub);
      font-weight: bold;
      margin-bottom: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .stat-label span {
      font-size: 9px;
      color: #60a5fa;
      background: rgba(96, 165, 250, 0.15);
      padding: 1px 4px;
      border-radius: 3px;
    }
    .stat-value {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .val-hit { color: #60a5fa; }
    .val-rec { color: var(--gold-color); }
    .stat-sub {
      font-size: 9px;
      color: #6b7280;
      margin-top: 2px;
    }

    .mark-rate-card {
      background: #151722;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      margin-bottom: 12px;
      padding: 10px 12px;
    }
    .mark-rate-header {
      font-size: 12px;
      font-weight: bold;
      color: #93c5fd;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }
    .mark-rate-body {
      display: flex;
      gap: 6px;
      justify-content: space-between;
    }
    .mark-item {
      flex: 1;
      text-align: center;
      background: rgba(255,255,255,0.03);
      padding: 6px 2px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.04);
    }
    .mark-item-symbol { font-size: 12px; font-weight: bold; margin-bottom: 2px; }
    .mark-item-pct { font-size: 13px; font-weight: 800; color: #fff; }
    .mark-item-sub { font-size: 8px; color: var(--text-sub); }

    .win5-card {
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.18), rgba(59, 130, 246, 0.12));
      border: 1px solid #8b5cf6;
      border-radius: 12px;
      margin-bottom: 14px;
      overflow: hidden;
      cursor: pointer;
    }
    .win5-header {
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .win5-title {
      font-size: 13px;
      font-weight: bold;
      color: #c084fc;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .win5-toggle-icon {
      font-size: 11px;
      color: #c084fc;
      background: rgba(139, 92, 246, 0.2);
      padding: 3px 8px;
      border-radius: 4px;
    }
    .win5-body {
      padding: 0 14px 14px;
      font-size: 12px;
      line-height: 1.6;
      color: #e2e8f0;
      white-space: pre-wrap;
      border-top: 1px dashed rgba(139, 92, 246, 0.3);
      padding-top: 10px;
    }

    .venue-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .tab-btn {
      flex: 1;
      padding: 9px 12px;
      background: #1f202e;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-sub);
      font-size: 13px;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      white-space: nowrap;
    }
    .tab-btn.active {
      background: var(--accent-color);
      color: #fff;
      border-color: var(--accent-color);
    }

    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: bold;
    }
    .badge-win5 { background: #8b5cf6; color: #fff; }
    .badge-grade { background: var(--red-color); color: #fff; }
    .badge-type {
      background: rgba(255, 215, 0, 0.15);
      color: var(--gold-color);
      border: 1px solid var(--gold-color);
    }

    .race-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      margin-bottom: 16px;
      overflow: hidden;
    }
    .race-header {
      padding: 12px 14px;
      background: rgba(255,255,255,0.02);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .race-title-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .race-title { font-size: 15px; font-weight: bold; }
    .race-detail-btn {
      background: rgba(59, 130, 246, 0.18);
      color: #93c5fd;
      border: 1px solid #3b82f6;
      border-radius: 6px;
      font-size: 10px;
      font-weight: bold;
      padding: 3px 7px;
      cursor: pointer;
      white-space: nowrap;
    }
    .race-detail-btn:active {
      transform: scale(0.96);
    }
    .race-meta { font-size: 11px; color: var(--text-sub); margin-top: 3px; }

    .ai-box {
      margin: 12px 14px;
      padding: 12px;
      background: rgba(59, 130, 246, 0.08);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 8px;
    }
    .ai-box-title {
      font-size: 12px;
      font-weight: bold;
      color: #60a5fa;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .ai-summary {
      font-size: 12px;
      line-height: 1.5;
      color: #d1d5db;
      margin-bottom: 8px;
    }
    .ai-buy {
      background: rgba(0,0,0,0.3);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      color: var(--gold-color);
    }

    .ai-legend-bar {
      margin: 0 14px 8px;
      padding: 6px 10px;
      background: rgba(255,255,255,0.03);
      border-radius: 6px;
      font-size: 10px;
      color: #9ca3af;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 4px;
    }

    .horse-table {
      width: 100%;
      border-collapse: collapse;
    }
    .horse-table th, .horse-table td {
      padding: 7px 6px;
      text-align: left;
      font-size: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .horse-table th { color: var(--text-sub); font-size: 9px; line-height: 1.2; }
    .horse-num { font-weight: bold; width: 22px; text-align: center; }
    .horse-name-wrap {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }
    .horse-name { font-weight: bold; font-size: 12px; cursor: pointer; }
