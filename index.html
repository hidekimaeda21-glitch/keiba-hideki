    function updateUI() {
      document.getElementById('stat-total-rate').textContent = aiState.totalRaces === 0 ? "0.0" : ((aiState.wonRaces / aiState.totalRaces) * 100).toFixed(1);
      document.getElementById('stat-today-rate').textContent = aiState.todayRaces === 0 ? "0.0" : ((aiState.todayWon / aiState.todayRaces) * 100).toFixed(1);

    }

    function buildTabs() {
      const venues = Object.keys(raceData);
      let html = '';
      venues.forEach(v => {
        const activeClass = currentVenue === v ? "bg-amber-500 text-slate-950 font-black shadow-md" : "bg-slate-800 text-slate-300 font-bold";
        html += `<button onclick="switchVenue('${v}')" class="flex-1 py-2 text-xs rounded-lg transition-all ${activeClass}">${v} (12R)</button>`;
      });
      document.getElementById('venue-tabs').innerHTML = html;
    }

    function switchVenue(venue) {
      currentVenue = venue;
      buildTabs();
      renderRaces();
    }

    function renderRaces() {
      const container = document.getElementById('race-container');
      const races = raceData[currentVenue] || [];
      let html = '';

      races.forEach(race => {
        let horsesHtml = '';
        race.horses.forEach(h => {
          const isTop = h.mark !== "-";
          const markColor = h.mark === "◎ 本命" ? "text-emerald-400 font-black" : "text-amber-400 font-bold";
          horsesHtml += `<div class="flex items-center p-2 border-b border-slate-700/30 horse-row text-xs">
            <span class="w-6 text-center font-black ${isTop ? 'text-amber-400' : 'text-slate-400'}">${h.num}</span>
            <div class="flex-1 ml-2">
              <p class="font-bold text-white">${h.name}</p>
              <p class="text-[9px] text-slate-400">${h.jockey} (${h.weight}kg)</p>
            </div>
            <span class="w-12 text-right font-mono text-slate-300">${h.odds}倍</span>
            <span class="w-16 text-right text-[10px] ${markColor}">${h.mark}</span>
          </div>`;
        });

        html += `<div class="bg-slate-800/40 border border-slate-700/50 rounded-2xl overflow-hidden shadow-xl mb-4">
          <div class="bg-slate-800/80 p-2.5 border-b border-slate-700/50 flex justify-between items-center text-xs">
            <span class="font-bold text-emerald-400">${currentVenue} ${race.raceNum}R - ${race.raceName} (${race.horses.length}頭)</span>
            <span class="font-mono text-slate-400">${race.startTime} 発走</span>
          </div>
          <div class="p-3">
            <div class="bg-slate-900 rounded-xl p-2.5 mb-3 border border-slate-700 text-xs flex justify-between items-center">
              <div>
                <p class="text-amber-400 font-black mb-1">🔥 AI厳選おすすめ買い目</p>
                <p class="text-white">【馬単軸1頭流し】 ${race.horses[0].num} → ${race.horses[1].num}, ${race.horses[2].num}</p>
              </div>
              <button onclick="learnRace(this)" class="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-slate-600 rounded-lg text-[10px] font-bold active:scale-95 transition">結果を学習</button>
            </div>
            <div class="bg-slate-900/80 rounded-xl border border-slate-700/50 overflow-hidden">${horsesHtml}</div>
          </div>
        </div>`;
      });

      container.innerHTML = html;
    }

    function learnRace(btn) {
      const hit = confirm("このレースのAI予想は的中しましたか？\n[OK] = 的中 / [キャンセル] = 不的中");
      aiState.totalRaces++; aiState.todayRaces++;
      if (hit) {
        aiState.wonRaces++; aiState.todayWon++;
        btn.textContent = "🎯 的中学習済";
        btn.className = "px-2.5 py-1.5 bg-emerald-900/50 text-emerald-300 border border-emerald-600 rounded-lg text-[10px] font-bold pointer-events-none";
