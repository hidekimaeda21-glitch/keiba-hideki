<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KEIBA AI PRO 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0b0f19;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>

<body class="pb-24">
  <header class="p-4 bg-slate-900 border-b border-slate-800 flex justify-between items-center sticky top-0 z-50">
    <div>
      <h1 class="text-lg font-black text-amber-400">KEIBA AI PRO 2026</h1>
      <p id="sync-status" class="text-xs text-emerald-400">● 18頭フルゲート・結果同期完了</p>
    </div>
    <button onclick="loadData()"
      class="px-3 py-1.5 bg-amber-500 text-slate-950 font-bold text-xs rounded-lg active:scale-95 transition">⚡
      競馬データ更新</button>
  </header>

  <main id="race-container" class="p-3 space-y-4">
    <div class="text-center text-slate-400 py-10">出走データを読み込み中...</div>
  </main>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwbGsrhWTNZ-uAiMVfvai3Dn0RtzAizHA1oVYk3ZDvvkfnOiQnJGhKg6dmPj0OBXEcX/exec";

    async function loadData() {
      const statusEl = document.getElementById("sync-status");
      statusEl.textContent = "● 同期中...";
      try {
        const res = await fetch(GAS_API_URL + "?action=fetch&t=" + new Date().getTime());
        const json = await res.json();
        if (json && json.success && json.races) {
          render(json.races);
          statusEl.textContent = "● 18頭フルゲート・結果同期完了";
        }
      } catch (e) {
        statusEl.textContent = "● オフライン表示中";
      }
    }

    function render(races) {
      const container = document.getElementById("race-container");
      let html = "";
      Object.keys(races).forEach((rName) => {
        const race = races[rName];
        const horses = race.horses || [];

        let horsesHtml = "";
        horses.forEach(h => {
          const isTop = h.mark && h.mark.indexOf("◎") !== -1;
          horsesHtml += `<div class="flex justify-between items-center p-2 mb-1 rounded text-xs ${isTop ? 'bg-amber-500/20 border border-amber-500/40' : 'bg-slate-900/60 border border-slate-800/40'}">
            <div><span class="font-bold mr-2 ${isTop ? 'text-amber-400' : 'text-slate-300'}">${h.num}番</span> <span class="text-white font-medium">${h.name}</span> <span class="text-slate-400 text-[11px]">(${h.jockey} / ${h.weight}kg)</span></div>
            <div><span class="font-mono text-amber-400 mr-2">${h.odds}倍</span><span class="font-bold text-emerald-400">${h.mark || '-'}</span></div>
          </div>`;
        });

        let resultHtml = "";
        if (race.resultRank || race.hitStatus) {
          resultHtml = `<div class="mt-3 p-2.5 bg-emerald-950/40 border border-emerald-500/40 rounded-lg text-xs flex justify-between items-center">
            <span class="text-emerald-400 font-bold">🎯 結果: ${race.hitStatus} (${race.resultRank})</span>
            <span class="text-amber-400 font-bold">払戻: ${race.payout} (収支: ${race.profit})</span>
          </div>`;
        }

        html += `<div class="bg-slate-900/90 border border-slate-800 rounded-xl p-3.5 shadow-lg mb-4">
          <div class="flex justify-between items-center mb-2">
            <span class="bg-emerald-500/20 text-emerald-400 px-2.5 py-0.5 rounded text-xs font-bold border border-emerald-500/30">${race.raceName}</span>
            <span class="text-xs text-slate-400 font-medium">出走全馬: ${horses.length}頭 (フルゲート)</span>
          </div>
          <div class="text-xs text-slate-400 mb-2 font-semibold">🎯 自信券種: ${race.betType}</div>
          <div class="space-y-1 mt-2 max-h-72 overflow-y-auto pr-1">
            ${horsesHtml}
          </div>
          ${resultHtml}
        </div>`;
      });
      container.innerHTML = html;
    }

    window.onload = loadData;
  </script>
</body>

</html>
