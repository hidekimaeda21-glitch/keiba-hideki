<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ジェミ予想 AI Predictor</title>
  <style>
    :root {
      --bg-color: #0f1015;
      --card-bg: #171822;
      --accent-color: #3b82f6;
      --gold-color: #ffd700;
      --green-color: #10b981;
      --red-color: #ef4444;
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --border-color: #27273a;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 12px;
      padding-bottom: 60px;
    }
    header {
      text-align: center;
      padding: 16px 0 12px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 16px;
    }
    h1 {
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .update-time {
      font-size: 11px;
      color: var(--text-sub);
      margin-top: 4px;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: bold;
    }
    .badge-win5 {
      background: #8b5cf6;
      color: #fff;
    }
    .badge-grade {
      background: var(--red-color);
      color: #fff;
    }
    .badge-type {
      background: rgba(255, 215, 0, 0.15);
      color: var(--gold-color);
      border: 1px solid var(--gold-color);
    }
    
    /* カード */
    .race-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      margin-bottom: 16px;
      overflow: hidden;
    }
    .race-header {
      padding: 12px 14px;
      background: rgba(255,255,255,0.02);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .race-title {
      font-size: 15px;
      font-weight: bold;
    }
    .race-meta {
      font-size: 11px;
      color: var(--text-sub);
    }

    /* AI見解エリア */
    .ai-box {
      margin: 12px 14px;
      padding: 12px;
      background: rgba(59, 130, 246, 0.08);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 8px;
    }
    .ai-box-title {
      font-size: 12px;
      font-weight: bold;
      color: #60a5fa;
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .ai-summary {
      font-size: 12px;
      line-height: 1.5;
      color: #d1d5db;
      margin-bottom: 8px;
    }
    .ai-buy {
      background: rgba(0,0,0,0.3);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      color: var(--gold-color);
    }

    /* 出走馬テーブル */
    .horse-table {
      width: 100%;
      border-collapse: collapse;
    }
    .horse-table th, .horse-table td {
      padding: 8px 10px;
      text-align: left;
      font-size: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .horse-table th {
      color: var(--text-sub);
      font-size: 10px;
    }
    .horse-num {
      font-weight: bold;
      width: 24px;
      text-align: center;
    }
    .horse-name {
      font-weight: bold;
      font-size: 13px;
    }
    .horse-sub {
      font-size: 10px;
      color: var(--text-sub);
    }
    .horse-odds {
      text-align: right;
      font-weight: bold;
      font-size: 13px;
    }
    .horse-score {
      font-size: 10px;
      color: #60a5fa;
      text-align: right;
    }
    .mark-honmei { color: #f87171; font-weight: bold; }
    .mark-taikou { color: #60a5fa; font-weight: bold; }
    .mark-tanana { color: #fbbf24; font-weight: bold; }
    .mark-ana { color: #c084fc; font-weight: bold; }
    .mark-renge { color: #34d399; font-weight: bold; }

    /* ポップアップ（モーダル） */
    #recommendModal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .modal-content {
      background: linear-gradient(145deg, #1c1d29, #12131c);
      border: 2px solid var(--gold-color);
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      position: relative;
    }
    .close-btn {
      position: absolute;
      top: 10px;
      right: 14px;
      background: none;
      border: none;
      font-size: 24px;
      color: #9ca3af;
      cursor: pointer;
    }
    .modal-badge {
      display: inline-block;
      background: var(--gold-color);
      color: #000;
      font-weight: 800;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <!-- 本日イチオシ最勝負レース ポップアップ（モーダル） -->
  <div id="recommendModal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      <div class="modal-badge">👑 本日イチオシ最勝負レース</div>
      <div id="modalRaceName" style="font-size: 18px; font-weight: bold; margin-bottom: 4px;"></div>
      <div id="modalMeta" style="font-size: 11px; color: var(--text-sub); margin-bottom: 12px;"></div>
      
      <div style="background: rgba(255,255,255,0.05); padding: 12px; border-radius: 8px; margin-bottom: 12px;">
        <div id="modalHonmei" style="font-size: 14px; font-weight: bold; color: #4ade80; margin-bottom: 4px;"></div>
        <div id="modalSummary" style="font-size: 12px; color: #d1d5db; line-height: 1.4;"></div>
      </div>

      <div style="background: rgba(255, 215, 0, 0.1); border-left: 3px solid var(--gold-color); padding: 10px; border-radius: 4px; margin-bottom: 16px;">
        <div style="font-size: 11px; color: var(--gold-color); font-weight: bold;">推奨買い目（回収率特化）</div>
        <div id="modalBuy" style="font-size: 13px; font-weight: bold; color: #fff; margin-top: 2px;"></div>
      </div>

      <button onclick="closeModal()" style="width: 100%; background: var(--accent-color); color: #fff; border: none; padding: 11px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer;">レース一覧を見る</button>
    </div>
  </div>

  <header>
    <h1>🧠 ジェミ予想 AI Predictor</h1>
    <div class="update-time" id="updateTime">データ読み込み中...</div>
  </header>

  <main id="raceContainer">
    <!-- レースカードが動的に挿入されます -->
  </main>

  <script>
    function getMarkClass(mark) {
      if (!mark) return '';
      if (mark.includes('◎')) return 'mark-honmei';
      if (mark.includes('○')) return 'mark-taikou';
      if (mark.includes('▲')) return 'mark-tanana';
      if (mark.includes('☆')) return 'mark-ana';
      if (mark.includes('△')) return 'mark-renge';
      return '';
    }

    function closeModal() {
      document.getElementById('recommendModal').style.display = 'none';
    }

    async function loadData() {
      try {
        const res = await fetch(`data/today.json?t=${new Date().getTime()}`);
        if (!res.ok) throw new Error('データが見つかりません');
        const data = await res.json();

        document.getElementById('updateTime').textContent = `${data.targetDate || ''} | 更新: ${data.updatedAt || '未更新'}`;

        // 1. 最勝負レースのポップアップ表示
        if (data.topRecommendation) {
          const top = data.topRecommendation;
          document.getElementById('modalRaceName').textContent = `${top.venue} ${top.raceName}`;
          document.getElementById('modalMeta').textContent = `発走: ${top.startTime} | 信頼度: ${top.confidence} (${top.confidenceScore}点)`;
          document.getElementById('modalHonmei').textContent = `◎ 本命: ${top.honmeiNum}番 ${top.honmeiName} (指数:${top.honmeiScore} / ${top.honmeiOdds}倍)`;
          document.getElementById('modalSummary').textContent = top.aiSummary;
          document.getElementById('modalBuy').textContent = top.aiBuy;
          
          document.getElementById('recommendModal').style.display = 'flex';
        }

        // 2. レース一覧の描画
        const container = document.getElementById('raceContainer');
        container.innerHTML = '';

        if (!data.races || data.races.length === 0) {
          container.innerHTML = '<div style="text-align:center; padding:40px; color:#888;">本日の対象レースデータはまだありません</div>';
          return;
        }

        data.races.forEach(r => {
          const card = document.createElement('div');
          card.className = 'race-card';

          const badges = [];
          if (r.isGraded) badges.push('<span class="badge badge-grade">重賞</span>');
          if (r.isWin5) badges.push('<span class="badge badge-win5">WIN5対象</span>');
          if (r.raceType) badges.push(`<span class="badge badge-type">${r.raceType}</span>`);

          let horseRows = '';
          r.horses.forEach(h => {
            const markClass = getMarkClass(h.mark);
            horseRows += `
              <tr>
                <td class="horse-num">${h.num}</td>
                <td>
                  <div class="horse-name">${h.name}</div>
                  <div class="horse-sub">${h.jockey} | ${h.style || '先行'}</div>
                </td>
                <td style="text-align:center;">
                  <span class="${markClass}">${h.mark || '-'}</span>
                </td>
                <td>
                  <div class="horse-odds">${h.odds ? h.odds.toFixed(1) + '倍' : '-'}</div>
                  <div class="horse-score">指数:${h.speedScore || '-'}</div>
                </td>
              </tr>
            `;
          });

          card.innerHTML = `
            <div class="race-header">
              <div>
                <div class="race-title">${r.venue} ${r.raceName}</div>
                <div class="race-meta">${r.startTime} 発走</div>
              </div>
              <div>${badges.join(' ')}</div>
            </div>

            <div class="ai-box">
              <div class="ai-box-title">
                <span>🧠 ジェミ予想 AI見解</span>
                <span>信頼度: ${r.confidence || 'B'} (${r.confidenceScore || 85}点)</span>
              </div>
              <div class="ai-summary">${r.aiSummary || '指数と展開から最適な買い目を導出しました。'}</div>
              <div class="ai-buy">推奨買い目: ${r.aiBuy || 'データ準備中'}</div>
            </div>

            <table class="horse-table">
              <thead>
                <tr>
                  <th style="width:24px; text-align:center;">馬番</th>
                  <th>馬名 / 騎手</th>
                  <th style="width:70px; text-align:center;">印</th>
                  <th style="width:65px; text-align:right;">オッズ/指数</th>
                </tr>
              </thead>
              <tbody>
                ${horseRows}
              </tbody>
            </table>
          `;
          container.appendChild(card);
        });

      } catch (e) {
        console.error(e);
        document.getElementById('updateTime').textContent = 'データの取得に失敗しました';
      }
    }

    window.onload = loadData;
  </script>
</body>
</html>
