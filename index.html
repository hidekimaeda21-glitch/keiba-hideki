<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KEIBA AI PRO 2026 全国重賞＆WIN5完全版</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0b0f19;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>

<body class="pb-24 max-w-xl mx-auto relative">

  <div id="confidence-popup"
    class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border-2 border-amber-500 rounded-2xl p-5 max-w-sm w-full shadow-2xl relative text-center">
      <div
        class="absolute -top-4 left-1/2 -transform -translate-x-1/2 bg-amber-500 text-slate-950 font-black text-xs px-3 py-1 rounded-full uppercase tracking-wider shadow">
        🔥 本日の勝負レース速報</div>
      <div class="text-3xl mt-2 mb-1">🎯</div>
      <h3 class="text-lg font-bold text-amber-400 mb-1">自信度95%超の勝負レース！</h3>
      <p id="popup-race-name" class="text-sm font-bold text-white mb-2">阪神 11R 大阪杯 (G1)</p>
      <p id="popup-desc"
        class="text-xs text-slate-300 bg-slate-950 p-3 rounded-lg border border-white/10 mb-4 leading-relaxed">
        AI独自の総合指数が極めて高く、軸馬の信頼度が非常に安定している絶対的な勝負レースです。
      </p>
      <button onclick="closePopup()"
        class="w-full py-2.5 bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-black text-sm rounded-xl shadow-lg active:scale-95 transition">
        予想を確認する
      </button>
    </div>
  </div>

  <header
    class="p-4 bg-slate-900 border-b border-slate-800 flex justify-between items-center sticky top-0 z-40 shadow-lg">
    <div>
      <h1 class="text-lg font-black text-amber-400">KEIBA AI PRO 2026</h1>
      <p id="sync-status" class="text-xs text-emerald-400">● 関西全12R・全国重賞・WIN5(32点)完全対応</p>
    </div>
    <button onclick="triggerFullDataUpdate()"
      class="px-3 py-1.5 bg-amber-500 text-slate-950 font-bold text-xs rounded-lg active:scale-95 transition shadow">⚡
      更新</button>
  </header>

  <div class="px-3 pt-3 flex gap-2 overflow-x-auto pb-1">
    <button onclick="switchFilter('all')" id="btn-filter-all"
      class="px-3 py-1.5 bg-amber-500 text-slate-950 font-bold text-xs rounded-lg shadow whitespace-nowrap transition">関西全12R</button>
    <button onclick="switchFilter('heavy')" id="btn-filter-heavy"
      class="px-3 py-1.5 bg-slate-800 text-slate-300 font-bold text-xs rounded-lg border border-white/10 whitespace-nowrap transition">🏆
      全国重賞</button>
    <button onclick="switchFilter('win5')" id="btn-filter-win5"
      class="px-3 py-1.5 bg-slate-800 text-slate-300 font-bold text-xs rounded-lg border border-white/10 whitespace-nowrap transition">👑
      WIN5 (32通り)</button>
  </div>

  <main id="race-cards-container" class="p-3 space-y-4 mt-1">
    <div class="text-center text-slate-400 py-10">データを読み込み中...</div>
  </main>

  <script>
    let currentFilter = "all";

    const localRaceData = {
      "阪神1R": { raceName: "阪神 1R 2歳未勝利", venue: "阪神", betType: "【馬単】 1 → 6, 12", confidence: "87%", resultRank: "1着: 1番", hitStatus: "🎯 的中", payout: "￥14,800", profit: "+￥11,800", isHeavy: false, win5Index: 0, comment: "AI独自の総合指数および展開・馬場適性を分析。", horses: [{ num: 1, name: "メイショウゴールド", jockey: "武豊", weight: "57", odds: "3.1", mark: "◎ 本命" }, { num: 2, name: "ホウオウゴールド", jockey: "坂井", weight: "58", odds: "3.0", mark: "○ 対抗" }] },
      "阪神2R": { raceName: "阪神 2R 3歳以上1勝クラス", venue: "阪神", betType: "【馬単】 1 → 2, 6", confidence: "89%", resultRank: "確定待ち", hitStatus: "公開中", payout: "￥0", profit: "￥0", isHeavy: false, win5Index: 0, comment: "前走の上がり3Fタイムがメンバー最速。", horses: [{ num: 1, name: "イクイノックス", jockey: "ルメール", weight: "56", odds: "1.8", mark: "◎ 本命" }, { num: 2, name: "ドウデュース", jockey: "武豊", weight: "56", odds: "3.2", mark: "○ 対抗" }] },
      "阪神3R": { raceName: "阪神 3R 3歳未勝利", venue: "阪神", betType: "【馬単】 3 → 1, 4", confidence: "85%", resultRank: "確定待ち", hitStatus: "公開中", payout: "￥0", profit: "￥0", isHeavy: false, win5Index: 0, comment: "ダート替わりでの変わり身が大きく稽古上々。", horses: [{ num: 3, name: "シンエンペラー", jockey: "坂井", weight: "56", odds: "3.5", mark: "◎ 本命" }] },
      "阪神4R": { raceName: "阪神 4R 障害4歳以上未勝利", venue: "阪神", betType: "【3連複】 2 - 1, 3, 5", confidence: "82%", resultRank: "確定待ち", hitStatus: "公開中", payout: "￥0", profit: "￥0", isHeavy: false, win5Index: 0, comment: "障害試験の飛越センスが非常高い。", horses: [{ num: 2, name: "オジュウチョウサン", jockey: "石神", weight: "60", odds: "1.9", mark: "◎ 本命" }] },
      "阪神5R": { raceName: "阪神 5R 2歳新馬", venue: "阪神", betType: "【馬単】 1 → 2, 4", confidence: "88%", resultRank: "確定待ち", hitStatus: "公開中", payout: "￥0", profit: "￥0", isHeavy: false, win5Index: 0, comment: "血統背景が魅力的でフットワーク軽快。", horses: [{ num: 1, name: "コントレイル", jockey: "福永", weight: "55", odds: "2.1", mark: "◎ 本命" }] },
      "阪神6R": { raceName: "阪神 6R 3歳1勝クラス", venue: "阪神", betType: "【馬単】 5 → 2, 3", confidence: "86%", resultRank: "確定待ち", hitStatus: "公開中", payout: "￥0", profit: "￥0", isHeavy: false, win5Index: 0, comment: "阪神替わりでパフォーマンス向上。", horses: [{ num: 5, name: "シャフリヤール", jockey: "C.デムーロ", weight: "56", odds: "3.2", mark: "◎ 本命" }] },
      "阪神7R": { raceName: "阪神 7R 4歳以上1勝クラス", venue: "阪神", betType: "【馬単】 4 → 1, 2", confidence: "84%", resultRank: "確定待ち", hitStatus: "公開中", payout: "￥0", profit: "￥0", isHeavy: false, win5Index: 0, comment: "昇級戦でもスピード上位。", horses: [{ num: 4, name: "テーオーケインズ", jockey: "松若", weight: "57", odds: "2.3", mark: "◎ 本命" }] },
      "阪神8R": { raceName: "阪神 8R 4歳以上2勝クラス", venue: "阪神", betType: "【馬単】 2 → 5, 7", confidence: "88%", resultRank: "確定待ち", hitStatus: "公開中", payout: "￥0", profit: "￥0", isHeavy: false, win5Index: 0, comment: "中団待機からメンバー最速の末脚。", horses: [{ num: 2, name: "ジャックドール", jockey: "武豊", weight: "58", odds: "2.2", mark: "◎ 本命" }] },
      "阪神9R": { raceName: "阪神 9R 鳴門ステークス", venue: "阪神", betType: "【3連複】 2 - 8, 3, 4", confidence: "91%", resultRank: "確定待ち", hitStatus: "公開中", payout: "￥0", profit: "￥0", isHeavy: true, win5Index: 1, win5Text: "👑 WIN5対象 (1レース目): 2番 リーチツモドライチ (2頭抜け)", comment: "阪神ダート1800mの特注データに合致。", horses: [{ num: 2, name: "リーチツモドライチ", jockey: "川田", weight: "55", odds: "4.3", mark: "◎ 本命" }, { num: 7, name: "スマートポジション", jockey: "松山", weight: "55", odds: "6.4", mark: "○ 対抗" }] },
      "中山10R": { raceName: "中山 10R スプリンターズS前哨戦 (全国重賞)", venue: "中山", betType: "【馬単】 3 → 1, 5", confidence: "90%", resultRank: "確定待ち", hitStatus: "公開中", payout: "￥0", profit: "￥0", isHeavy: true, win5Index: 2, win5Text: "👑 WIN5対象 (2レース目): 3番 ナランフレグ (2頭抜け)", comment: "中山芝1200mの重賞実績最上位。", horses: [{ num: 3, name: "ナランフレグ", jockey: "丸田", weight: "58", odds: "4.1", mark: "◎ 本命" }, { num: 1, name: "メイケイエール", jockey: "池添", weight: "56", odds: "2.8", mark: "○ 対抗" }] },
      "阪神10R": { raceName: "阪神 10R 豊中特別", venue: "阪神", betType: "【馬単】 4 → 1, 3", confidence: "87%", resultRank: "確定待ち", hitStatus: "公開中", payout: "￥0", profit: "￥0", isHeavy: true, win5Index: 3, win5Text: "👑 WIN5対象 (3レース目): 4番 アジアンエクスプレス (2頭抜け)", comment: "タフな馬場状態での経験が豊富。", horses: [{ num: 4, name: "アジアンエクスプレス", jockey: "戸崎", weight: "56", odds: "3.8", mark: "◎ 本命" }, { num: 1, name: "メイショウタバル", jockey: "浜中", weight: "56", odds: "4.2", mark: "○ 対抗" }] },
      "中山11R": { raceName: "中山 11R オールカマー (G2・全国重賞)", venue: "中山", betType: "【3連複】 5 - 2, 4, 7", confidence: "92%", resultRank: "確定待ち", hitStatus: "公開中", payout: "￥0", profit: "￥0", isHeavy: true, win5Index: 4, win5Text: "👑 WIN5対象 (4レース目): 5番 タイトルホルダー (2頭抜け)", comment: "中山2200m巧者。逃げ込みを狙う全国重賞の目玉。", horses: [{ num: 5, name: "タイトルホルダー", jockey: "横山和", weight: "58", odds: "2.1", mark: "◎ 本命" }, { num: 2, name: "ジェラルディーナ", jockey: "C.デムーロ", weight: "56", odds: "4.5", mark: "○ 対抗" }] },
      "阪神11R": { raceName: "阪神 11R 大阪杯 (G1・全国重賞)", venue: "阪神", betType: "【3連複】 1 - 3, 5, 8", confidence: "95%", resultRank: "確定待ち", hitStatus: "公開中", payout: "￥0", profit: "￥0", isHeavy: true, win5Index: 5, win5Text: "👑 WIN5対象 (5レース目最終): 1番 ステレンボッシュ (2頭抜け)", comment: "G1好走実績と阪神内回り2000mの舞台適性を最重視。", horses: [{ num: 1, name: "ステレンボッシュ", jockey: "ルメール", weight: "56", odds: "3.2", mark: "◎ 本命" }, { num: 2, name: "レガレイラ", jockey: "北村宏", weight: "56", odds: "4.5", mark: "○ 対抗" }] },
      "阪神12R": { raceName: "阪神 12R 4歳以上2勝クラス", venue: "阪神", betType: "【馬単】 1 → 3, 6", confidence: "90%", resultRank: "確定待ち", hitStatus: "公開中", payout: "￥0", profit: "￥0", isHeavy: false, win5Index: 0, comment: "最終レースに相応しい確勝級の軸馬。", horses: [{ num: 1, name: "ナミュール", jockey: "ルメール", weight: "55", odds: "2.1", mark: "◎ 本命" }] }
    };

    function switchFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll("[id^='btn-filter-']").forEach(btn => {
        btn.className = "px-3 py-1.5 bg-slate-800 text-slate-300 font-bold text-xs rounded-lg border border-white/10 whitespace-nowrap transition";
      });
      const activeBtn = document.getElementById("btn-filter-" + filter);
      if (activeBtn) {
        activeBtn.className = "px-3 py-1.5 bg-amber-500 text-slate-950 font-bold text-xs rounded-lg shadow whitespace-nowrap transition";
      }
      renderRaceCards(localRaceData, filter);
    }

    function renderRaceCards(races, filter = "all") {
      let container = document.getElementById("race-cards-container");
      if (!container) return;

      const raceNames = Object.keys(races);
      let html = "";

      if (filter === "win5") {
        html += `<div class="bg-gradient-to-br from-amber-950/80 to-slate-900 border-2 border-amber-500/60 rounded-2xl p-4 mb-4 shadow-2xl">
          <div class="flex justify-between items-center mb-2">
            <h2 class="text-amber-400 font-black text-sm flex items-center gap-1.5">👑 WIN5 徹底攻略 (完全32通りフォーメーション)</h2>
            <span class="bg-amber-500 text-slate-950 text-[10px] font-black px-2 py-0.5 rounded-full">計 32 点</span>
          </div>
          <p class="text-xs text-slate-300 mb-3 leading-relaxed">
            本日の指定WIN5対象5レース（各レース厳選2頭ずつの計2×2×2×2×2＝<strong class="text-amber-400">32通り</strong>）による買い目マトリックスです。少点数で最大限の的中を狙います。
          </p>
          <div class="space-y-2 mb-3">
            <div class="bg-slate-950/80 p-2.5 rounded-xl border border-white/10 text-xs flex justify-between items-center">
              <div><span class="text-amber-400 font-bold">1R: 阪神9R 鳴門S</span><div class="text-slate-300 text-[11px] mt-0.5">推奨馬: 2番 リーチツモドライチ / 7番 スマートポジション</div></div>
              <span class="bg-emerald-500/20 text-emerald-400 px-2 py-1 rounded text-[10px] font-bold">2頭選定</span>
            </div>
            <div class="bg-slate-950/80 p-2.5 rounded-xl border border-white/10 text-xs flex justify-between items-center">
              <div><span class="text-amber-400 font-bold">2R: 中山10R スプリンターズ前哨戦</span><div class="text-slate-300 text-[11px] mt-0.5">推奨馬: 3番 ナランフレグ / 1番 メイケイエール</div></div>
              <span class="bg-emerald-500/20 text-emerald-400 px-2 py-1 rounded text-[10px] font-bold">2頭選定</span>
            </div>
            <div class="bg-slate-950/80 p-2.5 rounded-xl border border-white/10 text-xs flex justify-between items-center">
              <div><span class="text-amber-400 font-bold">3R: 阪神10R 豊中特別</span><div class="text-slate-300 text-[11px] mt-0.5">推奨馬: 4番 アジアンエクスプレス / 1番 メイショウタバル</div></div>
              <span class="bg-emerald-500/20 text-emerald-400 px-2 py-1 rounded text-[10px] font-bold">2頭選定</span>
            </div>
            <div class="bg-slate-950/80 p-2.5 rounded-xl border border-white/10 text-xs flex justify-between items-center">
              <div><span class="text-amber-400 font-bold">4R: 中山11R オールカマー (G2)</span><div class="text-slate-300 text-[11px] mt-0.5">推奨馬: 5番 タイトルホルダー / 2番 ジェラルディーナ</div></div>
              <span class="bg-emerald-500/20 text-emerald-400 px-2 py-1 rounded text-[10px] font-bold">2頭選定</span>
            </div>
            <div class="bg-slate-950/80 p-2.5 rounded-xl border border-white/10 text-xs flex justify-between items-center">
              <div><span class="text-amber-400 font-bold">5R: 阪神11R 大阪杯 (G1)</span><div class="text-slate-300 text-[11px] mt-0.5">推奨馬: 1番 ステレンボッシュ / 2番 レガレイラ</div></div>
              <span class="bg-emerald-500/20 text-emerald-400 px-2 py-1 rounded text-[10px] font-bold">2頭選定</span>
            </div>
          </div>
          <div class="p-2.5 bg-amber-500/10 border border-amber-500/30 rounded-xl text-center text-xs text-amber-300 font-bold">
            💡 32点買いフォーメーション購入総額: 3,200円 (100円×32通り)
          </div>
        </div>`;
      }

      raceNames.forEach(function (rName, index) {
        const race = races[rName];
        if (filter === "heavy" && !race.isHeavy) return;
        if (filter === "win5" && !race.win5Text) return;

        const horses = race.horses || [];
        let topHorse = horses.find(h => h.mark && h.mark.indexOf("◎") !== -1) || horses[0];

        const venueBadge = race.venue || "阪神";
        const conf = race.confidence || "88%";
        const bet = race.betType || "買い目算出完了";
        const resultRank = race.resultRank || "";
        const hitStatus = race.hitStatus || "";
        const payout = race.payout || "";
        const profit = race.profit || "";
        const comment = race.comment || "AI独自の総合指数および展開・馬場適性を分析した推奨買い目です。";
        const win5Info = race.win5Text || "";

        let resultHtml = "";
        if (resultRank || hitStatus) {
          resultHtml = `<div class="mt-2 p-2 bg-emerald-950/40 border border-emerald-500/30 rounded-lg flex justify-between items-center text-xs">
            <span class="text-emerald-400 font-bold">🎯 結果: ${hitStatus} (${resultRank})</span>
            <span class="text-amber-400 font-bold">払戻: ${payout} (収支: ${profit})</span>
          </div>`;
        }

        let win5Html = "";
        if (win5Info) {
          win5Html = `<div class="mt-1.5 p-2 bg-amber-950/40 border border-amber-500/30 rounded-lg text-xs text-amber-400 font-bold">
            ${win5Info}
          </div>`;
        }

        let commentHtml = `<div class="mt-2 text-xs text-slate-300 bg-slate-950/80 border-l-3 border-emerald-400 p-2 rounded leading-relaxed">
          <span class="text-emerald-400 font-bold block mb-1">💡 AI見解・予想根拠</span>${comment}
        </div>`;

        let horsesListHtml = `<div class="mt-2.5 border-t border-white/10 pt-2">
          <div class="text-xs text-slate-400 mb-1.5 font-bold">出走登録馬ピックアップ (${horses.length}頭)</div>`;

        horses.forEach(function (h) {
          const isTop = h.mark && h.mark.indexOf("◎") !== -1;
          horsesListHtml += `<div class="flex justify-between items-center p-1.5 mb-1 bg-${isTop ? 'amber-500/10' : 'slate-950/30'} rounded text-xs">
            <div><span class="text-${isTop ? 'amber-400' : 'slate-300'} font-bold mr-1.5">${h.num}番</span> <span class="text-white">${h.name}</span> <span class="text-slate-400">(${h.jockey} / ${h.weight}kg)</span></div>
            <div><span class="text-amber-400 font-mono mr-2">${h.odds}倍</span><span class="text-emerald-400 font-bold">${h.mark || "-"}</span></div>
          </div>`;
        });
        horsesListHtml += `</div>`;

        html += `<div class="bg-slate-900/75 backdrop-blur border border-white/10 rounded-2xl p-3.5 mb-3.5 shadow-xl">
          <div class="flex justify-between items-center mb-2">
            <div class="flex items-center gap-2">
              <span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-xs font-bold px-2 py-0.5 rounded">${venueBadge}</span>
              <span class="text-white font-bold text-sm">${race.raceName}</span>
            </div>
            <span class="text-slate-400 text-xs font-mono">R${index + 1}</span>
          </div>
          <div class="bg-slate-950/60 p-2.5 rounded-xl border border-white/5 mb-2.5 flex justify-between items-center">
            <div>
              <span class="text-amber-400 text-[10px] font-bold block mb-0.5">本命推奨馬 (AIスコア首位)</span>
              <span class="text-white text-sm font-black">${topHorse.num}番 ${topHorse.name}</span>
              <span class="text-slate-400 text-xs ml-1">(${topHorse.jockey} / ${topHorse.weight}kg)</span>
            </div>
            <div class="text-right">
              <span class="text-amber-400 font-mono text-xs font-bold">${topHorse.odds}倍</span>
              <span class="block text-emerald-400 text-[10px] font-bold">的中率(自信度): ${conf}</span>
            </div>
          </div>
          <div class="text-xs text-slate-300 bg-emerald-950/25 border border-emerald-500/20 p-2 rounded-lg flex justify-between items-center">
            <span>🎯 ${bet}</span>
            <span class="text-emerald-400 font-bold text-[10px]">配分 ¥3,000</span>
          </div>
          ${win5Html}
          ${commentHtml}
          ${resultHtml}
          ${horsesListHtml}
        </div>`;
      });

      container.innerHTML = html || '<div class="text-center text-slate-400 py-10">該当するレースはありません</div>';
    }

    function closePopup() {
      const popup = document.getElementById("confidence-popup");
      if (popup) popup.classList.add("hidden");
    }

    function triggerFullDataUpdate() {
      const statusEl = document.getElementById("sync-status");
      if (statusEl) statusEl.textContent = "● 同期完了";
      renderRaceCards(localRaceData, currentFilter);
    }

    document.addEventListener("DOMContentLoaded", function () {
      renderRaceCards(localRaceData, "all");
      setTimeout(() => {
        const popup = document.getElementById("confidence-popup");
        if (popup) popup.classList.remove("hidden");
      }, 600);
    });
  </script>
</body>

</html>
