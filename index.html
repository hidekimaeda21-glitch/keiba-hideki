<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KEIBA AI PRO - ジェミ予想</title>
  <link rel="manifest" href="manifest.json">
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  <style>
    body {
      background-color: #0b0f19;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .tap-zoomable {
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }
    .tap-zoomable:active {
      transform: scale(0.98);
      opacity: 0.9;
    }
  </style>
</head>
<body class="p-3 pb-24 max-w-md mx-auto min-h-screen">

  <!-- ヘッダー -->
  <header class="flex justify-between items-center mb-3 pt-1">
    <h1 class="text-xl font-extrabold tracking-wider text-amber-400">KEIBA AI PRO</h1>
    <div class="flex items-center space-x-1 bg-indigo-950/80 border border-indigo-700/60 px-2.5 py-1 rounded-full text-xs text-indigo-300">
      <span>✨ Gemini頭脳連携</span>
    </div>
  </header>

  <!-- 実績パネル -->
  <div class="grid grid-cols-3 gap-2 bg-slate-900/90 border border-slate-800 rounded-xl p-3 mb-3 text-center shadow-lg">
    <div>
      <div class="text-[10px] text-slate-400 font-medium">的中率</div>
      <div class="text-lg font-bold text-emerald-400">100.0%</div>
    </div>
    <div>
      <div class="text-[10px] text-slate-400 font-medium">回収率</div>
      <div class="text-lg font-bold text-amber-400">285.0%</div>
    </div>
    <div>
      <div class="text-[10px] text-slate-400 font-medium">通算戦績</div>
      <div class="text-lg font-bold text-slate-200">1戦1勝</div>
    </div>
  </div>

  <!-- WIN5 厳選戦略枠（タップで拡大） -->
  <div id="win5-card" class="tap-zoomable bg-gradient-to-r from-purple-950/60 to-indigo-950/60 border border-purple-500/50 rounded-xl p-3.5 mb-3 shadow-md relative">
    <div class="flex items-center justify-between mb-1.5">
      <div class="flex items-center space-x-1.5 text-xs font-bold text-purple-300">
        <span>🎯 WIN5 厳選戦略 (10点以内)</span>
      </div>
      <span class="text-[10px] bg-purple-900/80 text-purple-200 px-2 py-0.5 rounded-full border border-purple-700/50">タップで拡大 🔍</span>
    </div>
    <div id="win5-text" class="text-xs text-purple-100 leading-relaxed font-mono whitespace-pre-wrap">読み込み中...</div>
  </div>

  <!-- 最終更新時刻 -->
  <div class="text-[11px] text-slate-400 mb-3 flex items-center space-x-1 pl-1">
    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 inline-block animate-pulse"></span>
    <span>最終更新: <span id="updated-at">--</span></span>
  </div>

  <!-- 会場切替タブ -->
  <div class="flex bg-slate-900 border border-slate-800 rounded-xl p-1 mb-4 shadow-inner">
    <button id="tab-kyoto" class="flex-1 py-2 text-sm font-bold rounded-lg transition-all bg-amber-500 text-slate-950 shadow">京都</button>
    <button id="tab-tokyo" class="flex-1 py-2 text-sm font-bold rounded-lg transition-all text-slate-400 hover:text-slate-200">東京</button>
  </div>

  <!-- 勝負レースTOP3セクション -->
  <div id="best-races-section" class="mb-4">
    <div class="text-xs font-bold text-amber-400 mb-2 flex items-center space-x-1">
      <span>🔥 本日の厳選勝負レース (信頼度TOP3)</span>
    </div>
    <div id="best-races-list" class="space-y-2"></div>
  </div>

  <!-- レース一覧コンテナ -->
  <div id="races-container" class="space-y-4"></div>

  <!-- 文字拡大表示用モーダル（タップで全面ポップアップ表示） -->
  <div id="zoom-modal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm p-4 hidden justify-center items-center">
    <div class="bg-slate-900 border-2 border-amber-400/80 rounded-2xl p-5 max-w-sm w-full max-h-[85vh] overflow-y-auto shadow-2xl flex flex-col">
      <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-700">
        <h3 id="zoom-modal-title" class="text-base font-bold text-amber-400">拡大表示</h3>
        <button id="zoom-close-btn" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1 rounded-full border border-slate-600">閉じる ×</button>
      </div>
      <div id="zoom-modal-content" class="text-white text-base leading-relaxed whitespace-pre-wrap font-sans"></div>
    </div>
  </div>

  <script>
    let allRacesData = [];
    let currentVenue = "京都";

    // モーダル操作関数
    const modal = document.getElementById("zoom-modal");
    const modalTitle = document.getElementById("zoom-modal-title");
    const modalContent = document.getElementById("zoom-modal-content");
    const closeBtn = document.getElementById("zoom-close-btn");

    function showZoomModal(title, content) {
      modalTitle.textContent = title;
      modalContent.textContent = content;
      modal.classList.remove("hidden");
      modal.classList.add("flex");
    }

    function hideZoomModal() {
      modal.classList.add("hidden");
      modal.classList.remove("flex");
    }

    modal.addEventListener("click", (e) => {
      if (e.target === modal || e.target === closeBtn) hideZoomModal();
    });
    closeBtn.addEventListener("click", hideZoomModal);

    // WIN5カードのタップ拡大登録
    document.getElementById("win5-card").addEventListener("click", () => {
      const text = document.getElementById("win5-text").textContent;
      showZoomModal("🎯 WIN5 厳選戦略 (拡大)", text);
    });

    // タブ切り替え処理
    const tabKyoto = document.getElementById("tab-kyoto");
    const tabTokyo = document.getElementById("tab-tokyo");

    tabKyoto.addEventListener("click", () => {
      currentVenue = "京都";
      tabKyoto.className = "flex-1 py-2 text-sm font-bold rounded-lg transition-all bg-amber-500 text-slate-950 shadow";
      tabTokyo.className = "flex-1 py-2 text-sm font-bold rounded-lg transition-all text-slate-400 hover:text-slate-200";
      renderRaces();
    });

    tabTokyo.addEventListener("click", () => {
      currentVenue = "東京";
      tabTokyo.className = "flex-1 py-2 text-sm font-bold rounded-lg transition-all bg-amber-500 text-slate-950 shadow";
      tabKyoto.className = "flex-1 py-2 text-sm font-bold rounded-lg transition-all text-slate-400 hover:text-slate-200";
      renderRaces();
    });

    async function loadData() {
      try {
        const res = await fetch("data/today.json?t=" + new Date().getTime());
        if (!res.ok) return;
        const data = await res.json();

        document.getElementById("updated-at").textContent = data.updatedAt || "--";
        document.getElementById("win5-text").textContent = data.win5Strategy || "WIN5情報なし";
        allRacesData = data.races || [];

        renderBestRaces(data.bestRaces || []);
        renderRaces();
      } catch (err) {
        console.error("データ読み込み失敗:", err);
      }
    }

    function renderBestRaces(bestRaces) {
      const container = document.getElementById("best-races-list");
      container.innerHTML = "";
      bestRaces.forEach((r, idx) => {
        const card = document.createElement("div");
        card.className = "tap-zoomable bg-slate-900/90 border border-rose-500/40 rounded-xl p-3 shadow-md";
        card.innerHTML = `
          <div class="flex justify-between items-center mb-1">
            <span class="text-[10px] bg-rose-950 text-rose-300 font-bold px-1.5 py-0.5 rounded border border-rose-800">勝負第${idx+1}弾</span>
            <span class="text-xs font-bold text-slate-200">${r.venue} ${r.raceName}</span>
            <span class="text-[10px] text-amber-400 font-bold">信頼度: ${r.confidence} (${r.confidenceScore}点)</span>
          </div>
          <div class="text-xs text-slate-300 line-clamp-2 mt-1">${r.aiSummary || ""}</div>
          <div class="text-xs font-bold text-amber-300 mt-1">推奨: ${r.aiBuy || ""}</div>
        `;
        card.addEventListener("click", () => {
          showZoomModal(`🔥 勝負第${idx+1}弾 ${r.venue} ${r.raceName}`, `【信頼度】${r.confidence} (${r.confidenceScore}点)\n\n【ジェミ予想 AI見解】\n${r.aiSummary}\n\n【推奨買い目】\n${r.aiBuy}`);
        });
        container.appendChild(card);
      });
    }

    function renderRaces() {
      const container = document.getElementById("races-container");
      container.innerHTML = "";

      const filtered = allRacesData.filter(r => r.venue === currentVenue);
      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center py-8 text-xs text-slate-500">該当レースはありません</div>`;
        return;
      }

      filtered.forEach(r => {
        const card = document.createElement("div");
        card.className = "bg-slate-900/90 border border-slate-800 rounded-2xl overflow-hidden shadow-lg";

        // 出走馬一覧
        let horsesHtml = "";
        (r.horses || []).forEach(h => {
          let markStyle = "text-slate-500";
          if (h.mark.includes("◎")) markStyle = "text-emerald-400 font-bold";
          else if (h.mark.includes("○")) markStyle = "text-amber-400 font-bold";
          else if (h.mark.includes("▲")) markStyle = "text-rose-400 font-bold";
          else if (h.mark.includes("☆")) markStyle = "text-purple-400 font-bold";
          else if (h.mark.includes("△")) markStyle = "text-sky-400 font-bold";

          horsesHtml += `
            <div class="flex items-center justify-between py-2 border-b border-slate-800/80 text-xs px-3">
              <div class="flex items-center space-x-2">
                <span class="w-5 text-center font-bold text-amber-400">${h.num}</span>
                <div>
                  <div class="font-bold text-slate-100">${h.name}</div>
                  <div class="text-[10px] text-slate-400">${h.jockey} <span class="bg-slate-800 px-1 rounded text-slate-300">${h.style || ""}</span> 上り${h.last3f || ""}</div>
                </div>
              </div>
              <div class="text-right">
                <div class="font-mono text-slate-200">${h.odds ? h.odds + "倍" : "---"}</div>
                <div class="text-[11px] ${markStyle}">${h.mark || "-"}</div>
              </div>
            </div>
          `;
        });

        card.innerHTML = `
          <div class="bg-slate-800/80 px-4 py-2.5 flex justify-between items-center border-b border-slate-700/60">
            <span class="font-bold text-sm text-slate-100">${r.venue} ${r.raceName}</span>
            <span class="text-xs text-slate-400 font-mono">${r.startTime} 発走</span>
          </div>

          <!-- AI見解枠（タップで拡大） -->
          <div class="tap-zoomable m-3 p-3 bg-indigo-950/40 border border-indigo-500/30 rounded-xl relative">
            <div class="flex justify-between items-center mb-1">
              <span class="text-xs font-bold text-indigo-300">🧠 ジェミ予想 AI見解</span>
              <span class="text-[10px] text-amber-400 font-bold">信頼度: ${r.confidence} (${r.confidenceScore}点)</span>
            </div>
            <p class="text-xs text-slate-300 leading-relaxed mb-2">${r.aiSummary || ""}</p>
            <div class="text-xs font-bold text-amber-300 bg-slate-900/80 p-2 rounded border border-slate-800">
              推奨買い目: ${r.aiBuy || ""}
            </div>
            <div class="text-right mt-1 text-[9px] text-indigo-400">タップで文字を拡大 🔍</div>
          </div>

          <div class="divide-y divide-slate-800/60">
            ${horsesHtml}
          </div>
        `;

        // AI見解枠のタップ拡大イベント
        const aiBox = card.querySelector(".tap-zoomable");
        aiBox.addEventListener("click", () => {
          showZoomModal(
            `🧠 ${r.venue} ${r.raceName} AI見解`,
            `【レース信頼度】\nランク: ${r.confidence} (${r.confidenceScore}点)\n\n【展開予測・選定理由】\n${r.aiSummary}\n\n【推奨買い目】\n${r.aiBuy}`
          );
        });

        container.appendChild(card);
      });
    }

    loadData();
  </script>
</body>
</html>
