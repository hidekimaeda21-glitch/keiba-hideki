    function switchFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll("[id^='btn-filter-']").forEach(btn => {
        btn.className = "px-3.5 py-1.5 bg-slate-800 text-slate-300 font-bold text-xs rounded-lg border border-white/10 whitespace-nowrap transition";
      });
      const activeBtn = document.getElementById("btn-filter-" + filter);
      if (activeBtn) {
        activeBtn.className = "px-3.5 py-1.5 bg-amber-500 text-slate-950 font-bold text-xs rounded-lg shadow whitespace-nowrap transition";
      }
      renderRaceCards(localRaceData, filter);
    }

    function renderRaceCards(races, filter = "all") {
      let container = document.getElementById("race-cards-container");
      if (!container) return;

      const raceNames = Object.keys(races);
      let html = "";

      if (filter === "win5") {
        html += `<div class="bg-gradient-to-br from-amber-950/80 to-slate-900 border-2 border-amber-500/60 rounded-2xl p-4 mb-4 shadow-2xl">
          <div class="flex justify-between items-center mb-2">

            <span class="bg-amber-500 text-slate-950 text-[10px] font-black px-2 py-0.5 rounded-full">計 32 点</span>
          </div>
          <p class="text-xs text-slate-300 mb-3 leading-relaxed">
            本日の厳選WIN5対象5レース（各2頭選定：2×2×2×2×2＝<strong class="text-amber-400">32通り</strong>）の買い目マトリックスです。
          </p>
          <div class="space-y-2 mb-3 text-xs">
            <div class="bg-slate-950/80 p-2.5 rounded-xl border border-white/10 flex justify-between items-center">
              <div><span class="text-amber-400 font-bold">1R: 阪神9R 鳴門S</span><div class="text-slate-300 text-[11px] mt-0.5">推奨馬: 2番 リーチツモドライチ / 7番 スマートポジション</div></div>
              <span class="bg-emerald-500/20 text-emerald-400 px-2 py-1 rounded text-[10px] font-bold">2頭選定</span>
            </div>
            <div class="bg-slate-950/80 p-2.5 rounded-xl border border-white/10 flex justify-between items-center">
              <div><span class="text-amber-400 font-bold">2R: 中山10R スプリンターズ前哨戦</span><div class="text-slate-300 text-[11px] mt-0.5">推奨馬: 3番 ナランフレグ / 1番 メイケイエール</div></div>
              <span class="bg-emerald-500/20 text-emerald-400 px-2 py-1 rounded text-[10px] font-bold">2頭選定</span>
            </div>
            <div class="bg-slate-950/80 p-2.5 rounded-xl border border-white/10 flex justify-between items-center">
              <div><span class="text-amber-400 font-bold">3R: 阪神10R 豊中特別</span><div class="text-slate-300 text-[11px] mt-0.5">推奨馬: 4番 アジアンエクスプレス / 1番 メイショウタバル</div></div>
              <span class="bg-emerald-500/20 text-emerald-400 px-2 py-1 rounded text-[10px] font-bold">2頭選定</span>
            </div>
            <div class="bg-slate-950/80 p-2.5 rounded-xl border border-white/10 flex justify-between items-center">
              <div><span class="text-amber-400 font-bold">4R: 中山11R オールカマー (G2)</span><div class="text-slate-300 text-[11px] mt-0.5">推奨馬: 5番 タイトルホルダー / 2番 ジェラルディーナ</div></div>
              <span class="bg-emerald-500/20 text-emerald-400 px-2 py-1 rounded text-[10px] font-bold">2頭選定</span>
            </div>
            <div class="bg-slate-950/80 p-2.5 rounded-xl border border-white/10 flex justify-between items-center">
              <div><span class="text-amber-400 font-bold">5R: 阪神11R 大阪杯 (G1)</span><div class="text-slate-300 text-[11px] mt-0.5">推奨馬: 1番 ステレンボッシュ / 2番 レガレイラ</div></div>
              <span class="bg-emerald-500/20 text-emerald-400 px-2 py-1 rounded text-[10px] font-bold">2頭選定</span>
            </div>
          </div>
          <div class="p-2.5 bg-amber-500/10 border border-amber-500/30 rounded-xl text-center text-xs text-amber-300 font-bold">
            💡 購入総額: 3,200円 (100円×32通り)
          </div>
        </div>`;
      }

      raceNames.forEach(function (rName, index) {
        const race = races[rName];
        if (filter === "heavy" && !race.isHeavy) return;
        if (filter === "win5" && !race.win5) return;

        const horses = race.horses || [];
        let topHorse = horses.reduce((max, h) => parseFloat(h.score) > parseFloat(max.score) ? h : max, horses[0]);

        const venueBadge = race.venue || "阪神";
        const conf = race.confidence || "88%";
        const bet = race.betType || "買い目算出完了";
        const resultRank = race.resultRank || "";
        const hitStatus = race.hitStatus || "";
        const payout = race.payout || "";
        const profit = race.profit || "";
        const comment = race.comment || "AI独自の総合指数および展開・馬場適性を分析。";
        const win5Info = race.win5 || "";

        let resultHtml = "";
        if (resultRank || hitStatus) {
          resultHtml = `<div class="mt-2 p-2 bg-emerald-950/40 border border-emerald-500/30 rounded-lg flex justify-between items-center text-xs">
            <span class="text-emerald-400 font-bold">🎯 結果: ${hitStatus} (${resultRank})</span>
            <span class="text-amber-400 font-bold">払戻: ${payout} (収支: ${profit})</span>
          </div>`;
        }

        let win5Html = "";
        if (win5Info) {
          win5Html = `<div class="mt-1.5 p-2 bg-amber-950/40 border border-amber-500/30 rounded-lg text-xs text-amber-400 font-bold">
            ${win5Info}
          </div>`;
        }

        let commentHtml = `<div class="mt-2 text-xs text-slate-300 bg-slate-950/80 border-l-3 border-emerald-400 p-2 rounded leading-relaxed">
          <span class="text-emerald-400 font-bold block mb-1">💡 AI見解・能力値分析</span>${comment}
        </div>`;

        let horsesListHtml = `<div class="mt-2.5 border-t border-white/10 pt-2">
          <div class="text-xs text-slate-400 mb-1.5 font-bold">出走全馬一覧 (${horses.length}頭立て・全頭表示)</div>`;

        horses.forEach(function (h) {
          const isTop = h.mark && h.mark.indexOf("◎") !== -1;
          horsesListHtml += `<div class="flex justify-between items-center p-1.5 mb-1 bg-${isTop ? 'amber-500/10' : 'slate-950/30'} rounded text-xs">
            <div><span class="text-${isTop ? 'amber-400' : 'slate-300'} font-bold mr-1.5">${h.num}番</span> <span class="text-white">${h.name}</span> <span class="text-slate-400">(${h.jockey} / ${h.weight}kg)</span></div>
            <div><span class="text-amber-400 font-mono mr-1.5">${h.odds}倍</span><span class="text-slate-300 font-mono text-[10px] mr-2">[AI:${h.score}]</span><span class="text-emerald-400 font-bold">${h.mark || "-"}</span></div>
          </div>`;
        });
        horsesListHtml += `</div>`;

        html += `<div class="bg-slate-900/75 backdrop-blur border border-white/10 rounded-2xl p-3.5 mb-3.5 shadow-xl">
          <div class="flex justify-between items-center mb-2">
            <div class="flex items-center gap-2">
              <span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-xs font-bold px-2 py-0.5 rounded">${venueBadge}</span>
              <span class="text-white font-bold text-sm">${race.raceName}</span>
            </div>
            <span class="text-slate-400 text-xs font-mono">R${index + 1}</span>
          </div>
          <div class="bg-slate-950/60 p-2.5 rounded-xl border border-white/5 mb-2.5 flex justify-between items-center">
            <div>
              <span class="text-amber-400 text-[10px] font-bold block mb-0.5">本命推奨馬 (AI能力値首位)</span>
              <span class="text-white text-sm font-black">${topHorse.num}番 ${topHorse.name}</span>
              <span class="text-slate-400 text-xs ml-1">(${topHorse.jockey} / ${topHorse.weight}kg)</span>
            </div>
            <div class="text-right">
              <span class="text-amber-400 font-mono text-xs font-bold">${topHorse.odds}倍</span>
              <span class="block text-emerald-400 text-[10px] font-bold">的中率(自信度): ${conf}</span>
            </div>
          </div>
          <div class="text-xs text-slate-300 bg-emerald-950/25 border border-emerald-500/20 p-2 rounded-lg flex justify-between items-center">
            <span>🎯 ${bet}</span>
            <span class="text-emerald-400 font-bold text-[10px]">配分 ¥3,000</span>
          </div>
          ${win5Html}
          ${commentHtml}
          ${resultHtml}
          ${horsesListHtml}
        </div>`;
      });

      container.innerHTML = html || '<div class="text-center text-slate-400 py-10">該当するレースはありません</div>';
    }

    function closePopup() {
      const popup = document.getElementById("confidence-popup");
      if (popup) popup.classList.add("hidden");
    }

    function triggerFullDataUpdate() {
      const statusEl = document.getElementById("sync-status");
      if (statusEl) statusEl.textContent = "● 同期完了";
      renderRaceCards(localRaceData, currentFilter);
    }

    document.addEventListener("DOMContentLoaded", function () {
      renderRaceCards(localRaceData, "all");
      setTimeout(() => {
        const popup = document.getElementById("confidence-popup");
        if (popup) popup.classList.remove("hidden");
      }, 600);
    });
  </script>
