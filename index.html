<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>KEIBA AI PRO 2026 - 全レース自動取得版</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0b0f19;
      color: #ffffff;
      font-family: -apple-system, sans-serif;
    }

    .horse-row:nth-child(even) {
      background-color: rgba(2, 6, 23, 0.4);
    }
  </style>
</head>

<body class="pb-24 max-w-xl mx-auto relative">

  <div id="confidence-popup"
    class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border-2 border-amber-500 rounded-2xl p-5 max-w-sm w-full shadow-2xl relative text-center">
      <div
        class="absolute -top-4 left-1/2 -transform -translate-x-1/2 bg-amber-500 text-slate-950 font-black text-xs px-3 py-1 rounded-full uppercase tracking-wider shadow">
        🔥 全レース自動取得・表示完了</div>
      <div class="text-3xl mt-2 mb-1">🎯</div>
      <h3 class="text-lg font-bold text-amber-400 mb-1">スプレッドシートと完全連動！</h3>
      <p class="text-xs text-slate-300 bg-slate-950 p-3 rounded-lg border border-white/10 mb-4 leading-relaxed">
        Yahoo競馬の最新出馬表をスクレイピングし、中山・阪神の全24レースを1頭の省略もなく全て表示するようにシステムを改修しました。
      </p>
      <button onclick="closePopup()"
        class="w-full py-2.5 bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-black text-sm rounded-xl shadow-lg active:scale-95 transition">最新データを確認する</button>
    </div>
  </div>

  <header
    class="p-4 bg-slate-900 border-b border-slate-800 flex justify-between items-center sticky top-0 z-40 shadow-lg">
    <div>
      <h1 class="text-lg font-black text-amber-400">KEIBA AI PRO 2026</h1>
      <p id="sync-status" class="text-xs text-emerald-400">● 9/27 自動取得データ同期完了</p>
    </div>
    <button onclick="triggerFullDataUpdate()"
      class="px-3 py-1.5 bg-amber-500 text-slate-950 font-bold text-xs rounded-lg active:scale-95 transition shadow">⚡
      一括更新</button>
  </header>

  <div class="px-3 pt-3 flex gap-2 overflow-x-auto pb-1">
    <button onclick="switchFilter('hanshin')" id="btn-filter-hanshin"
      class="px-3.5 py-1.5 bg-amber-500 text-slate-950 font-bold text-xs rounded-lg shadow whitespace-nowrap transition">🏟️
      阪神全R</button>
    <button onclick="switchFilter('nakayama')" id="btn-filter-nakayama"
      class="px-3.5 py-1.5 bg-slate-800 text-slate-300 font-bold text-xs rounded-lg border border-white/10 whitespace-nowrap transition">🏟️
      中山全R</button>
  </div>

  <main id="race-cards-container" class="p-3 space-y-4 mt-1">
    <div class="text-center text-slate-400 py-10">最新出走データを取得中...<br><span
        class="text-xs mt-2 block">※数秒かかる場合があります</span></div>
  </main>

  <script>
    // ★★★ お客様のGoogle Apps ScriptのURL ★★★
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwbGsrhWTNZ-uAiMVfvai3Dn0RtzAizHA1oVYk3ZDvvkfnOiQnJGhKg6dmPj0OBXEcX/exec";

    let currentFilter = "hanshin";
    let cachedRaces = null;

    async function triggerFullDataUpdate() {
      const container = document.getElementById("race-cards-container");
      const statusEl = document.getElementById("sync-status");
      statusEl.textContent = "● サーバーと通信中...";

      try {
        // GASから全24レースを一括取得
        const response = await fetch(GAS_API_URL + "?t=" + new Date().getTime());
        const result = await response.json();

        if (result && result.races) {
          cachedRaces = result.races;
          statusEl.textContent = "● 最新データ取得完了 (" + new Date().toLocaleTimeString() + ")";
          renderRaceCards(cachedRaces, currentFilter);
          document.getElementById("confidence-popup").classList.remove("hidden");
        }
      } catch (error) {
        statusEl.textContent = "● 通信エラー (再試行してください)";
        container.innerHTML = '<div class="text-center text-amber-500 py-10">データの取得に失敗しました。<br>GASのデプロイURLが正しいか確認してください。</div>';
      }
    }

    function switchFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll("[id^='btn-filter-']").forEach(btn => {
        btn.className = "px-3.5 py-1.5 bg-slate-800 text-slate-300 font-bold text-xs rounded-lg border border-white/10 whitespace-nowrap transition";
      });
      document.getElementById("btn-filter-" + filter).className = "px-3.5 py-1.5 bg-amber-500 text-slate-950 font-bold text-xs rounded-lg shadow whitespace-nowrap transition";
      if (cachedRaces) renderRaceCards(cachedRaces, filter);
    }

    function renderRaceCards(races, filter) {
      let container = document.getElementById("race-cards-container");
      const raceNames = Object.keys(races).filter(r => r.startsWith(filter === "hanshin" ? "阪神" : "中山"));

      // 1R〜12Rの順番に並び替え
      raceNames.sort((a, b) => parseInt(a.replace(/[^0-9]/g, '')) - parseInt(b.replace(/[^0-9]/g, '')));

      let html = "";
      raceNames.forEach(function (rName) {
        const race = races[rName];
        const horses = race.horses || [];
        let topHorse = horses.find(h => h.mark && h.mark.includes("◎")) || horses[0];

        let horsesListHtml = `<div class="mt-2.5 border-t border-white/10 pt-2"><div class="text-xs text-slate-400 mb-1.5 font-bold">出走全馬一覧 (${horses.length}頭立て・全頭表示)</div>`;
        horses.forEach(function (h) {
          const isTop = h.mark && h.mark.includes("◎");
          const markColor = isTop ? 'text-emerald-400' : 'text-slate-300';
          horsesListHtml += `<div class="flex justify-between items-center p-2 mb-1 rounded text-xs horse-row">
            <div><span class="text-amber-400 font-bold mr-1.5 text-sm w-4 inline-block text-center">${h.num}</span> <span class="text-white font-bold">${h.name}</span> <span class="text-slate-400 ml-1">(${h.weight}kg)</span></div>
            <div class="text-right"><span class="text-amber-400 font-mono mr-1.5 font-bold">${h.odds}倍</span><span class="${markColor} font-bold w-12 inline-block text-right">${h.mark || "-"}</span></div>
          </div>`;
        });
        horsesListHtml += `</div>`;

        html += `<div class="bg-slate-900/75 backdrop-blur border border-white/10 rounded-2xl p-3.5 mb-3.5 shadow-xl">
          <div class="flex justify-between items-center mb-2">
            <div class="flex items-center gap-2"><span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-xs font-bold px-2 py-0.5 rounded">${race.venue}</span><span class="text-white font-bold text-sm">${race.raceName}</span></div>
          </div>
          <div class="bg-slate-950/60 p-2.5 rounded-xl border border-white/5 mb-2.5 flex justify-between items-center">
            <div><span class="text-amber-400 text-[10px] font-bold block mb-0.5">本命推奨馬</span><span class="text-white text-sm font-black">${topHorse.num}番 ${topHorse.name}</span></div>
            <div class="text-right"><span class="text-amber-400 font-mono text-xs font-bold">${topHorse.odds}倍</span></div>
          </div>
          <div class="text-xs text-slate-300 bg-emerald-950/25 border border-emerald-500/20 p-2 rounded-lg flex justify-between items-center mb-2"><span>🎯 ${race.betType}</span></div>
          ${horsesListHtml}
        </div>`;
      });
      container.innerHTML = html;
    }

    function closePopup() { document.getElementById("confidence-popup").classList.add("hidden"); }
    document.addEventListener("DOMContentLoaded", triggerFullDataUpdate);
  </script>
</body>

</html>
