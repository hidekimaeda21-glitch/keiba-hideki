<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ジェミ予想 AI Predictor</title>
  <style>
    :root {
      --bg-color: #0f1015;
      --card-bg: #171822;
      --accent-color: #3b82f6;
      --gold-color: #ffd700;
      --green-color: #10b981;
      --red-color: #ef4444;
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --border-color: #27273a;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 12px;
      padding-bottom: 60px;
    }
    header {
      text-align: center;
      padding: 16px 0 12px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 12px;
      position: relative;
    }
    h1 {
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .update-time {
      font-size: 11px;
      color: var(--text-sub);
      margin-top: 4px;
    }
    .reload-btn {
      position: absolute;
      right: 4px;
      top: 18px;
      background: #27273a;
      color: #3b82f6;
      border: 1px solid #3b82f6;
      border-radius: 6px;
      font-size: 11px;
      padding: 4px 8px;
      cursor: pointer;
      font-weight: bold;
    }

    /* 的中率・回収率 ステータスバー */
    .stats-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    .stat-card {
      flex: 1;
      background: linear-gradient(145deg, #181926, #12131d);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
    }
    .stat-label {
      font-size: 10px;
      color: var(--text-sub);
      font-weight: bold;
      margin-bottom: 2px;
    }
    .stat-value {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .val-hit { color: #60a5fa; }
    .val-rec { color: var(--gold-color); }
    .stat-sub {
      font-size: 9px;
      color: #6b7280;
      margin-top: 2px;
    }

    /* 印別複勝圏内率（3着内率）アコーディオン */
    .mark-rate-card {
      background: #151722;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      margin-bottom: 12px;
      overflow: hidden;
      cursor: pointer;
    }
    .mark-rate-header {
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .mark-rate-title {
      font-size: 12px;
      font-weight: bold;
      color: #93c5fd;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .mark-rate-toggle-icon {
      font-size: 10px;
      color: #93c5fd;
      background: rgba(147, 197, 253, 0.15);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .mark-rate-body {
      padding: 10px 14px 12px;
      border-top: 1px dashed var(--border-color);
      display: none;
      gap: 6px;
      display: flex;
      justify-content: space-between;
    }
    .mark-item {
      flex: 1;
      text-align: center;
      background: rgba(255,255,255,0.03);
      padding: 6px 2px;
      border-radius: 6px;
    }
    .mark-item-symbol { font-size: 13px; font-weight: bold; margin-bottom: 2px; }
    .mark-item-pct { font-size: 13px; font-weight: 800; color: #fff; }
    .mark-item-sub { font-size: 8px; color: var(--text-sub); }

    /* WIN5 アコーディオンカード */
    .win5-card {
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.18), rgba(59, 130, 246, 0.12));
      border: 1px solid #8b5cf6;
      border-radius: 12px;
      margin-bottom: 14px;
      overflow: hidden;
      cursor: pointer;
    }
    .win5-header {
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .win5-title {
      font-size: 13px;
      font-weight: bold;
      color: #c084fc;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .win5-toggle-icon {
      font-size: 11px;
      color: #c084fc;
      background: rgba(139, 92, 246, 0.2);
      padding: 3px 8px;
      border-radius: 4px;
    }
    .win5-body {
      padding: 0 14px 14px;
      font-size: 12px;
      line-height: 1.6;
      color: #e2e8f0;
      white-space: pre-wrap;
      border-top: 1px dashed rgba(139, 92, 246, 0.3);
      padding-top: 10px;
    }

    /* 会場切り替えタブ */
    .venue-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .tab-btn {
      flex: 1;
      padding: 9px 12px;
      background: #1f202e;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-sub);
      font-size: 13px;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      white-space: nowrap;
    }
    .tab-btn.active {
      background: var(--accent-color);
      color: #fff;
      border-color: var(--accent-color);
    }

    /* バッジ */
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: bold;
    }
    .badge-win5 { background: #8b5cf6; color: #fff; }
    .badge-grade { background: var(--red-color); color: #fff; }
    .badge-type {
      background: rgba(255, 215, 0, 0.15);
      color: var(--gold-color);
      border: 1px solid var(--gold-color);
    }
    .badge-low-payout {
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
      border: 1px solid #fbbf24;
    }

    /* レースカード */
    .race-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      margin-bottom: 16px;
      overflow: hidden;
    }
    .race-header {
      padding: 12px 14px;
      background: rgba(255,255,255,0.02);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .race-title { font-size: 15px; font-weight: bold; }
    .race-meta { font-size: 11px; color: var(--text-sub); }

    /* AI見解エリア */
    .ai-box {
      margin: 12px 14px;
      padding: 12px;
      background: rgba(59, 130, 246, 0.08);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 8px;
    }
    .ai-box-title {
      font-size: 12px;
      font-weight: bold;
      color: #60a5fa;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .ai-summary {
      font-size: 12px;
      line-height: 1.5;
      color: #d1d5db;
      margin-bottom: 8px;
    }
    .ai-buy {
      background: rgba(0,0,0,0.3);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      color: var(--gold-color);
    }

    /* 出走馬テーブル */
    .horse-table {
      width: 100%;
      border-collapse: collapse;
    }
    .horse-table th, .horse-table td {
      padding: 8px 10px;
      text-align: left;
      font-size: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .horse-table th { color: var(--text-sub); font-size: 10px; }
    .horse-num { font-weight: bold; width: 24px; text-align: center; }
    .horse-name { font-weight: bold; font-size: 13px; }
    .horse-sub { font-size: 10px; color: var(--text-sub); }
    .horse-odds { text-align: right; font-weight: bold; font-size: 13px; }
    .horse-score { font-size: 10px; color: #60a5fa; text-align: right; }
    
    .mark-honmei { color: #f87171; font-weight: bold; }
    .mark-taikou { color: #60a5fa; font-weight: bold; }
    .mark-tanana { color: #fbbf24; font-weight: bold; }
    .mark-ana { color: #c084fc; font-weight: bold; }
    .mark-renge { color: #34d399; font-weight: bold; }

    /* ポップアップ（モーダル） */
    #recommendModal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .modal-content {
      background: linear-gradient(145deg, #1c1d29, #12131c);
      border: 2px solid var(--gold-color);
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      position: relative;
    }
    .close-btn {
      position: absolute;
      top: 10px;
      right: 14px;
      background: none;
      border: none;
      font-size: 24px;
      color: #9ca3af;
      cursor: pointer;
    }
    .modal-badge {
      display: inline-block;
      background: var(--gold-color);
      color: #000;
      font-weight: 800;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <!-- 本日イチオシ最勝負レース ポップアップ（モーダル） -->
  <div id="recommendModal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      <div class="modal-badge">👑 本日イチオシ最勝負レース</div>
      <div id="modalRaceName" style="font-size: 18px; font-weight: bold; margin-bottom: 4px;"></div>
      <div id="modalMeta" style="font-size: 11px; color: var(--text-sub); margin-bottom: 12px;"></div>
      
      <div style="background: rgba(255,255,255,0.05); padding: 12px; border-radius: 8px; margin-bottom: 12px;">
        <div id="modalHonmei" style="font-size: 14px; font-weight: bold; color: #4ade80; margin-bottom: 4px;"></div>
        <div id="modalSummary" style="font-size: 12px; color: #d1d5db; line-height: 1.4;"></div>
      </div>

      <div style="background: rgba(255, 215, 0, 0.1); border-left: 3px solid var(--gold-color); padding: 10px; border-radius: 4px; margin-bottom: 16px;">
        <div style="font-size: 11px; color: var(--gold-color); font-weight: bold;">推奨買い目（回収率特化）</div>
        <div id="modalBuy" style="font-size: 13px; font-weight: bold; color: #fff; margin-top: 2px;"></div>
      </div>

      <button onclick="closeModal()" style="width: 100%; background: var(--accent-color); color: #fff; border: none; padding: 11px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer;">レース一覧を見る</button>
    </div>
  </div>

  <header>
    <h1>🧠 ジェミ予想 AI Predictor</h1>
    <div class="update-time" id="updateTime">データ読み込み中...</div>
    <button class="reload-btn" onclick="loadData()">更新 ⟳</button>
  </header>

  <!-- 的中率・回収率 ステータス表示 -->
  <div class="stats-bar">
    <div class="stat-card">
      <div class="stat-label">AI 的中率</div>
      <div class="stat-value val-hit" id="hitRateDisplay">--%</div>
      <div class="stat-sub" id="hitCountDisplay">--R 的中</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">AI 通算回収率 (ROI)</div>
      <div class="stat-value val-rec" id="recoveryRateDisplay">--%</div>
      <div class="stat-sub">10点厳選回収特化</div>
    </div>
  </div>

  <!-- 印別 複勝圏内率（3着内率）アコーディオンカード -->
  <div class="mark-rate-card" onclick="toggleMarkRates()">
    <div class="mark-rate-header">
      <div class="mark-rate-title">📊 印別 複勝圏内率（3着内確率）</div>
      <div class="mark-rate-toggle-icon" id="markToggleIcon">▼ タップで展開</div>
    </div>
    <div class="mark-rate-body" id="markRateBody">
      <div class="mark-item">
        <div class="mark-item-symbol mark-honmei">◎ 本命</div>
        <div class="mark-item-pct" id="markPctHonmei">--%</div>
        <div class="mark-item-sub" id="markCountHonmei">--/--</div>
      </div>
      <div class="mark-item">
        <div class="mark-item-symbol mark-taikou">○ 対抗</div>
        <div class="mark-item-pct" id="markPctTaikou">--%</div>
        <div class="mark-item-sub" id="markCountTaikou">--/--</div>
      </div>
      <div class="mark-item">
        <div class="mark-item-symbol mark-tanana">▲ 単穴</div>
        <div class="mark-item-pct" id="markPctTanana">--%</div>
        <div class="mark-item-sub" id="markCountTanana">--/--</div>
      </div>
      <div class="mark-item">
        <div class="mark-item-symbol mark-ana">☆ 穴</div>
        <div class="mark-item-pct" id="markPctAna">--%</div>
        <div class="mark-item-sub" id="markCountAna">--/--</div>
      </div>
      <div class="mark-item">
        <div class="mark-item-symbol mark-renge">△ 連下</div>
        <div class="mark-item-pct" id="markPctRenge">--%</div>
        <div class="mark-item-sub" id="markCountRenge">--/--</div>
      </div>
    </div>
  </div>

  <!-- WIN5 アコーディオンカード -->
  <div class="win5-card" id="win5Card" onclick="toggleWin5()" style="display: none;">
    <div class="win5-header">
      <div class="win5-title">🎯 WIN5 AI厳選戦略（最大10点まで・予算1,000円以内）</div>
      <div class="win5-toggle-icon" id="win5ToggleIcon">▼ タップで展開</div>
    </div>
    <div class="win5-body" id="win5Body" style="display: none;"></div>
  </div>

  <!-- 会場切り替えタブ -->
  <div class="venue-tabs" id="venueTabs">
    <div class="tab-btn active" onclick="filterVenue('ALL')">全会場</div>
  </div>

  <main id="raceContainer">
    <!-- レースカードが動的に挿入されます -->
  </main>

  <script>
    let globalRaces = [];
    let currentFilter = 'ALL';

    function getMarkClass(mark) {
      if (!mark) return '';
      if (mark.includes('◎')) return 'mark-honmei';
      if (mark.includes('○')) return 'mark-taikou';
      if (mark.includes('▲')) return 'mark-tanana';
      if (mark.includes('☆')) return 'mark-ana';
      if (mark.includes('△')) return 'mark-renge';
      return '';
    }

    function closeModal() {
      document.getElementById('recommendModal').style.display = 'none';
    }

    function toggleMarkRates() {
      const body = document.getElementById('markRateBody');
      const icon = document.getElementById('markToggleIcon');
      if (body.style.display === 'none' || body.style.display === '') {
        body.style.display = 'flex';
        icon.textContent = '▲ 閉じる';
      } else {
        body.style.display = 'none';
        icon.textContent = '▼ タップで展開';
      }
    }

    function toggleWin5() {
      const body = document.getElementById('win5Body');
      const icon = document.getElementById('win5ToggleIcon');
      if (body.style.display === 'none') {
        body.style.display = 'block';
        icon.textContent = '▲ 閉じる';
      } else {
        body.style.display = 'none';
        icon.textContent = '▼ タップで展開';
      }
    }

    function filterVenue(venue) {
      currentFilter = venue;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.venue === venue || (venue === 'ALL' && btn.dataset.venue === undefined));
      });
      renderRaces();
    }

    function renderRaces() {
      const container = document.getElementById('raceContainer');
      container.innerHTML = '';

      const filtered = currentFilter === 'ALL' 
        ? globalRaces 
        : globalRaces.filter(r => r.venue === currentFilter);

      if (filtered.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:40px; color:#888;">該当するレースはありません</div>';
        return;
      }

      filtered.forEach(r => {
        const card = document.createElement('div');
        card.className = 'race-card';

        const badges = [];
        if (r.isGraded) badges.push('<span class="badge badge-grade">重賞</span>');
        if (r.isWin5) badges.push('<span class="badge badge-win5">WIN5対象</span>');
        if (r.raceType) badges.push(`<span class="badge badge-type">${r.raceType}</span>`);

        let horseRows = '';
        r.horses.forEach(h => {
          const markClass = getMarkClass(h.mark);
          horseRows += `
            <tr>
              <td class="horse-num">${h.num}</td>
              <td>
                <div class="horse-name">${h.name}</div>
                <div class="horse-sub">${h.jockey} | ${h.style || '先行'}</div>
              </td>
              <td style="text-align:center;">
                <span class="${markClass}">${h.mark || '-'}</span>
              </td>
              <td>
                <div class="horse-odds">${h.odds ? h.odds.toFixed(1) + '倍' : '-'}</div>
                <div class="horse-score">指数:${h.speedScore || '-'}</div>
              </td>
            </tr>
          `;
        });

        const lowPayoutBadge = r.isLowPayout ? '<span class="badge badge-low-payout">低配当警戒</span>' : '';

        card.innerHTML = `
          <div class="race-header">
            <div>
              <div class="race-title">${r.venue} ${r.raceName}</div>
              <div class="race-meta">${r.startTime} 発走</div>
            </div>
            <div>${badges.join(' ')}</div>
          </div>

          <div class="ai-box">
            <div class="ai-box-title">
              <span>🧠 ジェミ予想 AI見解</span>
              <div style="display:flex; align-items:center; gap:6px;">
                ${lowPayoutBadge}
                <span>信頼度: ${r.confidence || 'B'} (${r.confidenceScore || 85}点)</span>
              </div>
            </div>
            <div class="ai-summary">${r.aiSummary || '指数と展開から最適な買い目を導出しました。'}</div>
            <div class="ai-buy">推奨買い目: ${r.aiBuy || 'データ準備中'}</div>
          </div>

          <table class="horse-table">
            <thead>
              <tr>
                <th style="width:24px; text-align:center;">馬番</th>
                <th>馬名 / 騎手</th>
                <th style="width:70px; text-align:center;">印</th>
                <th style="width:65px; text-align:right;">オッズ/指数</th>
              </tr>
            </thead>
            <tbody>
              ${horseRows}
            </tbody>
          </table>
        `;
        container.appendChild(card);
      });
    }

    async function loadData() {
      try {
        const res = await fetch(`data/today.json?nocache=${new Date().getTime()}`, {
          cache: 'no-store'
        });
        if (!res.ok) throw new Error('データが見つかりません');
        const data = await res.json();

        document.getElementById('updateTime').textContent = `${data.targetDate || ''} | 更新: ${data.updatedAt || '未更新'}`;

        // 1. 的中率・回収率の表示
        if (data.stats) {
          document.getElementById('hitRateDisplay').textContent = `${data.stats.hitRate}%`;
          document.getElementById('hitCountDisplay').textContent = `${data.stats.totalBets}戦 ${data.stats.hitCount}的中`;
          document.getElementById('recoveryRateDisplay').textContent = `${data.stats.recoveryRate}%`;

          // 印別 複勝率の反映
          const mr = data.stats.markRates || {};
          if (mr['◎']) {
            document.getElementById('markPctHonmei').textContent = `${mr['◎'].rate}%`;
            document.getElementById('markCountHonmei').textContent = mr['◎'].count;
          }
          if (mr['○']) {
            document.getElementById('markPctTaikou').textContent = `${mr['○'].rate}%`;
            document.getElementById('markCountTaikou').textContent = mr['○'].count;
          }
          if (mr['▲']) {
            document.getElementById('markPctTanana').textContent = `${mr['▲'].rate}%`;
            document.getElementById('markCountTanana').textContent = mr['▲'].count;
          }
          if (mr['☆']) {
            document.getElementById('markPctAna').textContent = `${mr['☆'].rate}%`;
            document.getElementById('markCountAna').textContent = mr['☆'].count;
          }
          if (mr['△']) {
            document.getElementById('markPctRenge').textContent = `${mr['△'].rate}%`;
            document.getElementById('markCountRenge').textContent = mr['△'].count;
          }
        }

        // 2. WIN5 戦略の表示
        if (data.win5Strategy) {
          document.getElementById('win5Body').textContent = data.win5Strategy;
          document.getElementById('win5Card').style.display = 'block';
        }

        // 3. 最勝負レースのポップアップ表示
        if (data.topRecommendation) {
          const top = data.topRecommendation;
          document.getElementById('modalRaceName').textContent = `${top.venue} ${top.raceName}`;
          document.getElementById('modalMeta').textContent = `発走: ${top.startTime} | 信頼度: ${top.confidence} (${top.confidenceScore}点)`;
          document.getElementById('modalHonmei').textContent = `◎ 本命: ${top.honmeiNum}番 ${top.honmeiName} (指数:${top.honmeiScore} / ${top.honmeiOdds}倍)`;
          document.getElementById('modalSummary').textContent = top.aiSummary;
          document.getElementById('modalBuy').textContent = top.aiBuy;
          
          document.getElementById('recommendModal').style.display = 'flex';
        }

        globalRaces = data.races || [];

        // 4. 会場切り替えタブの動的生成
        const venues = [...new Set(globalRaces.map(r => r.venue))];
        const tabsContainer = document.getElementById('venueTabs');
        tabsContainer.innerHTML = '<div class="tab-btn active" onclick="filterVenue(\'ALL\')">全会場</div>';
        venues.forEach(v => {
          const btn = document.createElement('div');
          btn.className = 'tab-btn';
          btn.dataset.venue = v;
          btn.textContent = v;
          btn.onclick = () => filterVenue(v);
          tabsContainer.appendChild(btn);
        });

        renderRaces();

      } catch (e) {
        console.error(e);
        document.getElementById('updateTime').textContent = 'データの取得に失敗しました';
      }
    }

    window.onload = loadData;
  </script>
</body>
</html>
