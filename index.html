<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KEIBA AI PRO - 全自動システム</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0f19; color: #ffffff; font-family: -apple-system, sans-serif; }
    .horse-row:nth-child(even) { background-color: rgba(255, 255, 255, 0.03); }
    ::-webkit-scrollbar { display: none; }
    .loader { border: 2px solid rgba(255,255,255,0.1); border-top: 2px solid #fbbf24; border-radius: 50%; width: 14px; height: 14px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="pb-24 max-w-xl mx-auto relative min-h-screen flex flex-col">

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzrsLzDrCcWbLZJSiYlOtH9cUSWAYVE8UetzG5tse_XZWt3mOVPH6XYjsw4QWuS17Pk/exec";
  </script>

  <header class="sticky top-0 z-40 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 shadow-xl">
    <div class="p-3 flex justify-between items-center">
      <div>
        <h1 class="text-lg font-black text-amber-400">KEIBA AI PRO</h1>
        <p id="last-update" class="text-[10px] text-emerald-400 font-mono mt-0.5 flex items-center gap-1">● 最終更新: 未取得</p>
      </div>
      <button onclick="fetchData(true)" class="flex items-center gap-1 px-3 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs rounded-xl shadow-lg active:scale-95 transition-all">
        最新データ更新
      </button>
    </div>

    <div class="px-3 pb-3">
      <div class="bg-slate-950 rounded-xl p-2 flex justify-between items-center border border-slate-800">
        <div class="text-center w-1/2 border-r border-slate-800">
          <p class="text-[10px] text-slate-400 font-bold mb-0.5">総的中率 (学習済)</p>
          <p class="text-base font-black text-emerald-400"><span id="stat-total-rate">--</span><span class="text-[10px] text-emerald-500">%</span></p>
        </div>
        <div class="text-center w-1/2">
          <p class="text-[10px] text-slate-400 font-bold mb-0.5">当日の的中率</p>
          <p class="text-base font-black text-amber-400"><span id="stat-today-rate">--</span><span class="text-[10px] text-amber-500">%</span> <span class="text-[9px] text-slate-500 font-normal" id="stat-today-count">(0/0)</span></p>
        </div>
      </div>
    </div>

    <div id="venue-tabs" class="flex px-2 pb-2 gap-1.5 overflow-x-auto">
      <div class="text-xs text-slate-400 flex items-center gap-2 px-2">データを待機中...</div>
    </div>
  </header>

  <main id="race-container" class="p-3 flex-1">
    <div class="text-center py-10 text-slate-500 text-sm">右上の「最新データ更新」を押してください</div>
  </main>

  <script>
    let aiState = JSON.parse(localStorage.getItem('keibaAiStats')) || {
      totalRaces: 0, wonRaces: 0,
      today: new Date().toLocaleDateString(), todayRaces: 0, todayWon: 0,
      weights: { odds: 1.0, weight: 1.0, jockey: 1.0 }
    };

    function updateUI() {
      document.getElementById('stat-total-rate').textContent = aiState.totalRaces === 0 ? "0.0" : ((aiState.wonRaces / aiState.totalRaces) * 100).toFixed(1);
      document.getElementById('stat-today-rate').textContent = aiState.todayRaces === 0 ? "0.0" : ((aiState.todayWon / aiState.todayRaces) * 100).toFixed(1);
      document.getElementById('stat-today-count').textContent = `(${aiState.todayWon}/${aiState.todayRaces}R)`;
    }
    updateUI();

    let allRaces = [];
    let venues = [];
    let currentTab = "";

    function fetchData(force = false) {
      const container = document.getElementById('race-container');
      const tabs = document.getElementById('venue-tabs');
      tabs.innerHTML = `<div class="text-xs text-amber-400 flex items-center gap-2 px-2"><div class="loader"></div> データを読み込み中...</div>`;

      const script = document.createElement('script');
      const callbackName = 'jsonpCallback_' + Math.round(100000 * Math.random());
      
      window[callbackName] = function(data) {
        delete window[callbackName];
        document.body.removeChild(script);

        try {
          if (data.error) throw new Error(data.error);
          
          // オブジェクト型データを安全に配列に変換
          const racesArray = Array.isArray(data.races) ? data.races : Object.values(data.races);

          allRaces = processAiScores(racesArray); 
          document.getElementById('last-update').innerHTML = `● 最終更新: ${data.updatedAt}`;
          venues = [...new Set(allRaces.map(r => r.venue))];
          buildTabs();
          switchTab(venues[0]); 
        } catch (err) {
          container.innerHTML = `<div class="bg-red-950 p-4 text-center text-red-400 text-xs">エラー: ${err.message}</div>`;
        }
      };

      script.src = GAS_API_URL + "?callback=" + callbackName;
      document.body.appendChild(script);
    }

    function processAiScores(races) {
      return races.map(race => {
        race.horses.forEach(h => {
          let score = 70 + (100 / (h.odds + 1));
          h.score = score.toFixed(1);
        });
        const ranked = [...race.horses].sort((a, b) => b.score - a.score);
        ranked.forEach((h, i) => {
          h.mark = i === 0 ? "◎ 本命" : i === 1 ? "○ 対抗" : i === 2 ? "▲ 単穴" : i === 3 ? "☆ 穴" : "-";
        });
        race.ranked = ranked;
        return race;
      });
    }

    function buildTabs() {
      let html = '';
      venues.forEach(v => {
        html += `<button onclick="switchTab('${v}')" id="tab-${v}" class="flex-1 py-2 bg-slate-800 text-slate-300 font-bold text-xs rounded-lg">${v}</button>`;
      });
      document.getElementById('venue-tabs').innerHTML = html;
    }

    function switchTab(tabId) {
      currentTab = tabId;
      renderRaces();
    }

    function renderRaces() {
      let html = '';
      const targetRaces = allRaces.filter(r => r.venue === currentTab);
      
      targetRaces.forEach(race => {
        const top = race.ranked;
        let horsesHtml = '';
        race.horses.forEach(h => {
          horsesHtml += `<div class="flex items-center p-2 border-b border-slate-700/30 horse-row text-xs">
            <span class="w-6 text-amber-400 font-bold">${h.num}</span>
            <span class="flex-1 text-white font-bold">${h.name}</span>
            <span class="w-12 text-right font-mono">${h.odds}倍</span>
            <span class="w-16 text-right text-emerald-400 font-bold">${h.mark}</span>
          </div>`;
        });

        html += `<div class="bg-slate-800/40 border border-slate-700/50 rounded-2xl p-3 mb-4">
          <h3 class="text-white font-bold text-sm mb-2">${race.raceName} (${race.startTime}発走)</h3>
          <div class="bg-slate-900 p-2 rounded mb-2 text-xs text-amber-400">◎ 本命: ${top[0].name} / ○ 対抗: ${top[1].name}</div>
          <div class="bg-slate-900 rounded overflow-hidden">${horsesHtml}</div>
        </div>`;
      });
      document.getElementById('race-container').innerHTML = html;
    }

    fetchData();
  </script>
</body>
</html>
