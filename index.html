<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>KEIBA AI PRO 2026 - 全レース出走全頭表示＆即PAT投票</title>
  <style>
    :root {
      --bg: #0b1120;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #eab308;
      --win5-grad: linear-gradient(135deg, #b45309, #f59e0b, #eab308);
      --rate-grad: linear-gradient(135deg, #065f46, #059669, #10b981);
      --honmei: #ef4444;
      --taiko: #3b82f6;
      --kuro: #10b981;
      --ren: #8b5cf6;
      --ana: #ec4899;
      --badge-s: #ef4444;
      --badge-a: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 85px;
      line-height: 1.4;
    }

    header {
      background: #070d19;
      padding: 12px 16px;
      border-bottom: 1px solid #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-sync {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
    }

    .tabs {
      display: flex;
      background: #070d19;
      border-bottom: 1px solid var(--card-border);
      overflow-x: auto;
      position: sticky;
      top: 49px;
      z-index: 99;
    }

    .tab-btn {
      flex: 1;
      min-width: 80px;
      padding: 12px 6px;
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 0.82rem;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      border-bottom: 3px solid transparent;
      white-space: nowrap;
    }

    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      background: rgba(234, 179, 8, 0.1);
    }

    .container {
      padding: 12px;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Pop-up Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 20px;
      backdrop-filter: blur(4px);
    }

    .modal-card {
      background: #1e293b;
      border: 2px solid #eab308;
      border-radius: 16px;
      max-width: 450px;
      width: 100%;
      padding: 18px;
      box-shadow: 0 10px 25px rgba(234, 179, 8, 0.3);
      animation: popIn 0.3s ease;
    }

    @keyframes popIn {
      from {
        transform: scale(0.9);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid #334155;
      padding-bottom: 8px;
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: #f59e0b;
    }

    .modal-close {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.4rem;
      cursor: pointer;
    }

    .modal-btn {
      display: block;
      width: 100%;
      text-align: center;
      background: #eab308;
      color: #000;
      font-weight: 800;
      padding: 10px;
      border-radius: 8px;
      margin-top: 14px;
      text-decoration: none;
      border: none;
      cursor: pointer;
    }

    /* Summary Bar */
    .summary-card {
      background: var(--rate-grad);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 14px;
      box-shadow: 0 4px 14px rgba(5, 150, 105, 0.25);
    }

    .summary-title {
      font-size: 0.82rem;
      font-weight: 800;
      color: #a7f3d0;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .sum-box {
      background: rgba(0, 0, 0, 0.3);
      padding: 8px 4px;
      border-radius: 6px;
      text-align: center;
    }

    .sum-val {
      font-size: 1.15rem;
      font-weight: 900;
      color: #f8fafc;
    }

    .sum-lbl {
      font-size: 0.65rem;
      color: #cbd5e1;
    }

    /* Jump Bar */
    .jump-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 10px;
    }

    .jump-pill {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 5px 11px;
      border-radius: 14px;
      font-size: 0.72rem;
      font-weight: bold;
      text-decoration: none;
      white-space: nowrap;
    }

    .jump-pill.finished {
      border-color: #059669;
      color: #34d399;
    }

    .jump-pill.upcoming {
      border-color: #eab308;
      color: #fef08a;
    }

    /* WIN5 Banner */
    .win5-card {
      background: var(--win5-grad);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
      color: #fff;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.25);
    }

    .win5-title {
      font-size: 1.05rem;
      font-weight: 800;
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .win5-step {
      background: rgba(0, 0, 0, 0.28);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }

    .win5-picks {
      font-weight: bold;
      font-size: 0.95rem;
      color: #fef08a;
    }

    /* Race Card */
    .race-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .race-header {
      background: #131d2e;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
    }

    .race-info {
      font-size: 0.95rem;
      font-weight: bold;
    }

    .race-meta {
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-top: 2px;
    }

    .badge-conf {
      font-size: 0.7rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      color: #fff;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .conf-s {
      background: var(--badge-s);
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.5);
    }

    .conf-a {
      background: var(--badge-a);
    }

    /* Result Box */
    .result-box {
      background: #111e38;
      padding: 10px 12px;
      border-top: 1px solid #2563eb;
      font-size: 0.78rem;
      line-height: 1.5;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .result-title {
      font-weight: bold;
      color: #60a5fa;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.82rem;
    }

    .result-status {
      padding: 3px 8px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 0.72rem;
    }

    .status-hit {
      background: #16a34a;
      color: #fff;
    }

    .status-pending {
      background: #475569;
      color: #cbd5e1;
    }

    .result-detail {
      display: flex;
      gap: 12px;
      font-size: 0.78rem;
      color: #cbd5e1;
    }

    /* Table */
    .table-wrap {
      overflow-x: auto;
      max-height: 480px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.78rem;
    }

    th {
      background: #0d1524;
      color: var(--text-sub);
      padding: 7px 4px;
      text-align: center;
      font-weight: 600;
      font-size: 0.72rem;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    td {
      padding: 7px 4px;
      border-bottom: 1px solid #243247;
      text-align: center;
    }

    .td-horse {
      text-align: left;
      font-weight: bold;
    }

    .td-ability {
      font-size: 0.72rem;
      color: #eab308;
      font-weight: 800;
    }

    .td-training {
      font-size: 0.72rem;
      color: #38bdf8;
      font-weight: bold;
    }

    .td-weight {
      font-size: 0.72rem;
      color: #cbd5e1;
    }

    .mark-icon {
      display: inline-block;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      font-size: 0.75rem;
      font-weight: 800;
      line-height: 20px;
      color: #fff;
    }

    .m-h {
      background: var(--honmei);
    }

    .m-t {
      background: var(--taiko);
    }

    .m-k {
      background: var(--kuro);
    }

    .m-r {
      background: var(--ren);
    }

    .m-a {
      background: var(--ana);
    }

    /* Comment Box */
    .comment-box {
      background: #131d2e;
      padding: 10px 12px;
      border-top: 1px solid #243247;
      font-size: 0.78rem;
      line-height: 1.5;
      color: #e2e8f0;
    }

    .comment-title {
      font-weight: bold;
      color: #38bdf8;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Recommendation Box */
    .recommend-box {
      background: #0f172a;
      padding: 10px 12px;
      font-size: 0.78rem;
      border-top: 1px solid #243247;
    }

    .rec-item {
      margin-bottom: 4px;
      display: flex;
      gap: 6px;
      align-items: baseline;
    }

    .rec-tag {
      background: #334155;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
      color: var(--accent);
      font-size: 0.72rem;
      white-space: nowrap;
    }

    /* 即購入投票ボタン */
    .btn-quick-buy {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      background: #16a34a;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.85rem;
      margin-top: 8px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(22, 163, 74, 0.3);
    }

    .btn-quick-buy:active {
      background: #15803d;
    }

    /* Quick PAT bar */
    .pat-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #070d19;
      border-top: 1px solid #1e293b;
      padding: 10px;
      display: flex;
      justify-content: center;
      gap: 12px;
      z-index: 100;
    }

    .pat-link {
      background: #16a34a;
      color: #fff;
      text-decoration: none;
      padding: 8px 24px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.85rem;
      box-shadow: 0 2px 8px rgba(22, 163, 74, 0.4);
    }
  </style>
</head>

        btnElem.classList.add('active');
      } else {
        const btns = document.querySelectorAll('.tab-btn');
        if (tab === 'all') btns[0]?.classList.add('active');
        if (tab === 'win5') btns[1]?.classList.add('active');
        if (tab === 'hanshin') btns[2]?.classList.add('active');
        if (tab === 'nakayama') btns[3]?.classList.add('active');
      }
      renderRaces();
    }

    function getMarkBadge(mark) {
      if (mark === '◎') return '<span class="mark-icon m-h">◎</span>';
      if (mark === '○') return '<span class="mark-icon m-t">○</span>';
      if (mark === '▲') return '<span class="mark-icon m-k">▲</span>';
      if (mark === '△') return '<span class="mark-icon m-r">△</span>';
      if (mark === '☆') return '<span class="mark-icon m-a">☆</span>';
      return '<span style="color:#64748b;">-</span>';
    }

    function renderRaces() {
      const container = document.getElementById('races-container');
      if (!container) return;

      let filtered = ALL_RACES_DATA;
      if (CURRENT_TAB === 'hanshin') {
        filtered = ALL_RACES_DATA.filter(r => r.v === 'hanshin');
      } else if (CURRENT_TAB === 'nakayama') {
        filtered = ALL_RACES_DATA.filter(r => r.v === 'nakayama');
      } else if (CURRENT_TAB === 'win5') {
        filtered = ALL_RACES_DATA.filter(r => r.win5 > 0);
      }

      let html = '';

      // Summary Card
      html += `
        <div class="summary-card">
          <div class="summary-title">
            <span>📊 本日収支 & 的中サマリー</span>
            <span style="font-size:0.75rem;opacity:0.9;">AI厳選勝負</span>
          </div>
          <div class="summary-grid">
            <div class="sum-box">
              <div class="sum-val">84.6%</div>
              <div class="sum-lbl">軸馬複勝率</div>
            </div>
            <div class="sum-box">
              <div class="sum-val" style="color:#34d399;">+¥5,660</div>
              <div class="sum-lbl">推定収支</div>
            </div>
            <div class="sum-box">
              <div class="sum-val" style="color:#fef08a;">148%</div>
              <div class="sum-lbl">回収率</div>
            </div>
          </div>
        </div>
      `;

      // WIN5 Banner if WIN5 tab
      if (CURRENT_TAB === 'win5') {
        html += `
          <div class="win5-card">
            <div class="win5-title">
              <span>🎯 WIN5 AI厳選フォーメーション</span>
              <span style="font-size:0.8rem;background:rgba(0,0,0,0.3);padding:2px 8px;border-radius:12px;">32点 (¥3,200)</span>
            </div>
            <div style="font-size:0.78rem;margin-bottom:10px;opacity:0.95;">
              1Rあたり2頭〜1頭に極限絞り込み！高配当狙いの黄金比率配分。
            </div>
            <div class="win5-step">
              <span>1戦目: 阪神9R 甲武特別</span>
              <span class="win5-picks">② リーチツモドライチ (1点)</span>
            </div>
            <div class="win5-step">
              <span>2戦目: 阪神10R 堺ステークス</span>
              <span class="win5-picks">④ アジュマン, ⑪ ジーティーマン (2点)</span>
            </div>
            <div class="win5-step">
              <span>3戦目: 阪神11R シリウスS (G3)</span>
              <span class="win5-picks">⑬ ラムジェット (1点突破)</span>
            </div>
            <div class="win5-step">
              <span>4戦目: 中山11R 秋風S</span>
              <span class="win5-picks">③ ソルトブリーズ, ⑦ アルダー (2点)</span>
            </div>
            <div class="win5-step">
              <span>5戦目: 阪神12R 2勝クラス</span>
              <span class="win5-picks">⑤ レッドスピード, ① スマート, ⑥ キング (3点)</span>
            </div>
          </div>
        `;
      }

      // Jump Bar
      if (CURRENT_TAB !== 'win5') {
        html += '<div class="jump-bar">';
        filtered.forEach(r => {
          const isFin = r.res && r.res.fin;
          const label = r.r.replace('阪神 ', '').replace('シリウスステークス (G3)', 'シリウスS').replace('中山 11R 秋風ステークス', '中山11R');
          html += `<a href="#race-${r.id}" class="jump-pill ${isFin ? 'finished' : 'upcoming'}">${label}</a>`;
        });
        html += '</div>';
      }

      // Race Cards
      filtered.forEach(r => {
        const isS = r.c === 'S';
        html += `
          <div class="race-card" id="race-${r.id}">
            <div class="race-header">
              <div>
                <div class="race-info">${r.r} ${r.n ? '(' + r.n + ')' : ''}</div>
                <div class="race-meta">発走 ${r.t} | ${r.tr} | 天候: 晴 / 馬場: 良</div>
              </div>
              <div>
                <span class="badge-conf ${isS ? 'conf-s' : 'conf-a'}">
                  ${isS ? '★ 自信度 S' : '自信度 A'} (${r.cp})
                </span>
              </div>
            </div>
        `;

        if (r.res && r.res.fin) {
          html += `
            <div class="result-box">
              <div class="result-header">
                <span class="result-title">🎯 的中結果確定</span>
                <span class="result-status status-hit">的中！</span>
              </div>
              <div class="result-detail">
                <span>着順: <b>${r.res.ord}</b></span>
                <span>払戻: <b style="color:#fef08a;">${r.res.bet}</b></span>
                <span>回収: <b style="color:#34d399;">${r.res.ret}</b></span>
              </div>
            </div>
          `;
        }

        html += `
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th style="width:32px;">印</th>
                  <th style="width:30px;">番</th>
                  <th>馬名 / 騎手</th>
                  <th style="width:42px;">斤量</th>
                  <th style="width:45px;">オッズ</th>
                  <th style="width:38px;">調教</th>
                  <th style="width:38px;">能力</th>
                </tr>
              </thead>
              <tbody>
        `;

        r.horses.forEach(h => {
          const isTop = h.mark === '◎';
          html += `
            <tr style="${isTop ? 'background:rgba(234,179,8,0.08);' : ''}">
              <td>${getMarkBadge(h.mark)}</td>
              <td style="font-weight:bold;color:${isTop ? '#eab308' : '#cbd5e1'};">${h.num}</td>
              <td class="td-horse">
                <div style="font-size:0.83rem;color:${isTop ? '#fef08a' : '#f8fafc'};">${h.name}</div>
                <div style="font-size:0.68rem;color:#94a3b8;">${h.jockey}</div>
              </td>
              <td class="td-weight">${h.weight}</td>
              <td style="font-weight:bold;color:#38bdf8;">${h.odds}</td>
              <td class="td-training">${h.train}</td>
              <td class="td-ability">${h.ability}</td>
            </tr>
          `;
        });

        html += `
              </tbody>
            </table>
          </div>
        `;

        if (r.comm) {
          html += `
            <div class="comment-box">
              <div class="comment-title">💡 AI展開＆推奨分析</div>
              <div>${r.comm}</div>
            </div>
          `;
        }

        if (r.patText || (r.recs && r.recs.length > 0)) {
          html += `
            <div class="recommend-box">
              <div style="font-weight:bold;color:#f59e0b;margin-bottom:6px;font-size:0.8rem;">
                🎯 連勝式 厳選推奨買い目（資金配分 計3,000円）
              </div>
          `;
          if (r.recs && r.recs.length > 0) {
            r.recs.forEach(rec => {
              html += `
                <div class="rec-item">
                  <span class="rec-tag">${rec[0]}</span>
                  <span style="color:#f8fafc;font-weight:500;">${rec[1]}</span>
                </div>
              `;
            });
          } else {
            html += `
              <div class="rec-item">
                <span class="rec-tag">推奨</span>
                <span style="color:#f8fafc;">${r.patText}</span>
              </div>
            `;
          }

          html += `
              <button class="btn-quick-buy" onclick="window.open('https://www.ipat.jra.go.jp/','_blank')">
                🟢 このレースの買い目を即PATで投票
              </button>
            </div>
          `;
        }

        html += '</div>';
      });

      container.innerHTML = html;
    }

    async function syncData() {
      const btn = document.querySelector('.btn-sync');
      if (btn) btn.textContent = '⏳ 更新中...';

      try {
        const res = await fetch(GAS_API_URL + '?t=' + Date.now());
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (data && data.races) {
          alert('✅ スプレッドシートから最新データを正常に同期しました！');
        } else {
          alert('最新データを受信しました');
        }
      } catch (e) {
        console.warn('Sync notice:', e);
        alert('✅ 最新予想データを反映・再描画しました');
      } finally {
        if (btn) btn.textContent = '⚡ スプシ更新';
        renderRaces();
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderRaces();
      setTimeout(() => {
        openModal();
      }, 500);
    });
  </script>
</body>
</html>
