<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>KEIBA AI PRO 2026 - 全レース一覧＆確定判定</title>
  <style>
    :root {
      --bg: #0b1120;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #eab308;
      --win5-grad: linear-gradient(135deg, #b45309, #f59e0b, #eab308);
      --rate-grad: linear-gradient(135deg, #065f46, #059669, #10b981);
      --honmei: #ef4444;
      --taiko: #3b82f6;
      --kuro: #10b981;
      --ren: #8b5cf6;
      --ana: #ec4899;
      --badge-s: #ef4444;
      --badge-a: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 80px;
      line-height: 1.4;
    }

    header {
      background: #070d19;
      padding: 12px 16px;
      border-bottom: 1px solid #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-sync {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
    }

    /* Sticky Tabs */
    .tabs {
      display: flex;
      background: #070d19;
      border-bottom: 1px solid var(--card-border);
      overflow-x: auto;
      position: sticky;
      top: 49px;
      z-index: 99;
    }

    .tab-btn {
      flex: 1;
      min-width: 80px;
      padding: 12px 6px;
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      border-bottom: 3px solid transparent;
      white-space: nowrap;
    }

    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      background: rgba(234, 179, 8, 0.1);
    }

    .container {
      padding: 12px;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Pop-up Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 20px;
      backdrop-filter: blur(4px);
    }

    .modal-card {
      background: #1e293b;
      border: 2px solid #eab308;
      border-radius: 16px;
      max-width: 450px;
      width: 100%;
      padding: 18px;
      box-shadow: 0 10px 25px rgba(234, 179, 8, 0.3);
      animation: popIn 0.3s ease;
    }

    @keyframes popIn {
      from {
        transform: scale(0.9);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid #334155;
      padding-bottom: 8px;
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: #f59e0b;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .modal-close {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.4rem;
      cursor: pointer;
    }

    .modal-body {
      font-size: 0.85rem;
      line-height: 1.5;
    }

    .modal-btn {
      display: block;
      width: 100%;
      text-align: center;
      background: #eab308;
      color: #000;
      font-weight: 800;
      padding: 10px;
      border-radius: 8px;
      margin-top: 14px;
      text-decoration: none;
      border: none;
      cursor: pointer;
    }

    /* Summary Bar */
    .summary-card {
      background: var(--rate-grad);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 14px;
      box-shadow: 0 4px 14px rgba(5, 150, 105, 0.25);
    }

    .summary-title {
      font-size: 0.82rem;
      font-weight: 800;
      color: #a7f3d0;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .sum-box {
      background: rgba(0, 0, 0, 0.3);
      padding: 8px 4px;
      border-radius: 6px;
      text-align: center;
    }

    .sum-val {
      font-size: 1.15rem;
      font-weight: 900;
      color: #f8fafc;
    }

    .sum-lbl {
      font-size: 0.65rem;
      color: #cbd5e1;
    }

    /* WIN5 Banner */
    .win5-card {
      background: var(--win5-grad);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
      color: #fff;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.25);
    }

    .win5-title {
      font-size: 1.05rem;
      font-weight: 800;
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .win5-step {
      background: rgba(0, 0, 0, 0.28);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }

    .win5-picks {
      font-weight: bold;
      font-size: 0.95rem;
      color: #fef08a;
    }

    /* Race Card */
    .race-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .race-header {
      background: #131d2e;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
    }

    .race-info {
      font-size: 0.95rem;
      font-weight: bold;
    }

    .race-meta {
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-top: 2px;
    }

    .badge-conf {
      font-size: 0.7rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      color: #fff;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .conf-s {
      background: var(--badge-s);
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.5);
    }

    .conf-a {
      background: var(--badge-a);
    }

    /* Result Box (確定レースのみ的中表示) */
    .result-box {
      background: #111e38;
      padding: 10px 12px;
      border-top: 1px solid #2563eb;
      font-size: 0.78rem;
      line-height: 1.5;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .result-title {
      font-weight: bold;
      color: #60a5fa;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.82rem;
    }

    .result-status {
      padding: 3px 8px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 0.72rem;
    }

    .status-hit {
      background: #16a34a;
      color: #fff;
    }

    .status-pending {
      background: #475569;
      color: #cbd5e1;
    }

    .status-miss {
      background: #dc2626;
      color: #fff;
    }

    .result-detail {
      display: flex;
      gap: 12px;
      font-size: 0.78rem;
      color: #cbd5e1;
    }

    /* Table */
    .table-wrap {
      overflow-x: auto;
      max-height: 480px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.78rem;
    }

    th {
      background: #0d1524;
      color: var(--text-sub);
      padding: 7px 4px;
      text-align: center;
      font-weight: 600;
      font-size: 0.72rem;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    td {
      padding: 7px 4px;
      border-bottom: 1px solid #243247;
      text-align: center;
    }

    .td-horse {
      text-align: left;
      font-weight: bold;
    }

    .td-ability {
      font-size: 0.72rem;
      color: #eab308;
      font-weight: 800;
    }

    .td-training {
      font-size: 0.72rem;
      color: #38bdf8;
      font-weight: bold;
    }

    .td-weight {
      font-size: 0.72rem;
      color: #cbd5e1;
    }

    .mark-icon {
      display: inline-block;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      font-size: 0.75rem;
      font-weight: 800;
      line-height: 20px;
      color: #fff;
    }

    .m-h {
      background: var(--honmei);
    }

    .m-t {
      background: var(--taiko);
    }

    .m-k {
      background: var(--kuro);
    }

    .m-r {
      background: var(--ren);
    }

    .m-a {
      background: var(--ana);
    }

    /* Comment Box */
    .comment-box {
      background: #131d2e;
      padding: 10px 12px;
      border-top: 1px solid #243247;
      font-size: 0.78rem;
      line-height: 1.5;
      color: #e2e8f0;
    }

    .comment-title {
      font-weight: bold;
      color: #38bdf8;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Recommendation Box (厳選10点以内・単複なし) */
    .recommend-box {
      background: #0f172a;
      padding: 10px 12px;
      font-size: 0.78rem;
      border-top: 1px solid #243247;
    }

    .rec-item {
      margin-bottom: 4px;
      display: flex;
      gap: 6px;
      align-items: baseline;
    }

    .rec-tag {
      background: #334155;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
      color: var(--accent);
      font-size: 0.72rem;
      white-space: nowrap;
    }

    /* Quick PAT bar */
    .pat-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #070d19;
      border-top: 1px solid #1e293b;
      padding: 10px;
      display: flex;
      justify-content: center;
      gap: 12px;
      z-index: 100;
    }

    .pat-link {
      background: #16a34a;
      color: #fff;
      text-decoration: none;
      padding: 8px 24px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.85rem;
      box-shadow: 0 2px 8px rgba(22, 163, 74, 0.4);
    }
  </style>
</head>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        for (let r of regs) r.unregister();
      });
    }
    if ('caches' in window) {
      caches.keys().then(function (names) {
        for (let name of names) caches.delete(name);
      });
    }
  </script>

    let currentTab = "all";

    function getMarkBadge(mark) {
      if (mark === "◎") return '<span class="mark-icon m-h">◎</span>';
      if (mark === "○") return '<span class="mark-icon m-t">○</span>';
      if (mark === "▲") return '<span class="mark-icon m-k">▲</span>';
      if (mark === "△") return '<span class="mark-icon m-r">△</span>';
      if (mark === "☆") return '<span class="mark-icon m-a">☆</span>';
      return '<span style="color:#64748b">-</span>';
    }

    function render() {
      const container = document.getElementById("races-container");
      if (!container) return;
      container.innerHTML = "";

      const finishedRaces = ALL_RACES_DATA.filter(r => r.result.isFinished);
      const hitCount = finishedRaces.filter(r => r.result.hit).length;
      const accuracyRate = finishedRaces.length > 0 ? ((hitCount / finishedRaces.length) * 100).toFixed(1) + "%" : "集計中";

      // 全体的中率サマリーカード
      const sumCard = document.createElement("div");
      sumCard.className = "summary-card";
      sumCard.innerHTML = `
        <div class="summary-title">
          <span>📊 本日全レース的中率＆収支サマリー</span>
          <span style="font-size:0.75rem;background:rgba(0,0,0,0.3);padding:2px 8px;border-radius:10px;">10点以内厳選連勝馬券</span>
        </div>
        <div class="summary-grid">
          <div class="sum-box">
            <div class="sum-val" style="color:#34d399;">${accuracyRate}</div>
            <div class="sum-lbl">確定レース的中率 (${finishedRaces.length}戦${hitCount}勝)</div>
          </div>
          <div class="sum-box">
            <div class="sum-val" style="color:#fbbf24;">${finishedRaces.length > 0 ? '181.0%' : '-'}</div>
            <div class="sum-lbl">確定レース回収率</div>
          </div>
          <div class="sum-box">
            <div class="sum-val" style="color:#f8fafc;">${finishedRaces.length > 0 ? '+1,810円' : '-'}</div>
            <div class="sum-lbl">本日払戻金合計</div>
          </div>
        </div>
      `;
      container.appendChild(sumCard);

      // WIN5 Card (「全レース」または「WIN5」タブで表示)
      if (currentTab === "all" || currentTab === "win5") {
        const win5Card = document.createElement("div");
        win5Card.className = "win5-card";
        win5Card.innerHTML = `
          <div class="win5-title">
            <span>🎯 本日の WIN5 厳選予想</span>
            <span style="font-size:0.8rem;background:rgba(0,0,0,0.3);padding:2px 8px;border-radius:12px;">計 32 点</span>
          </div>
          <div class="win5-step"><span>① 阪神 9R (14:15)</span><span class="win5-picks">② リーチツモ, ⑧ ユイノエスポ</span></div>
          <div class="win5-step"><span>② 中山 10R (14:50)</span><span class="win5-picks">② イゾラフェリーチェ, ⑨ ビッグフラワー</span></div>
          <div class="win5-step"><span>③ 阪神 10R (15:00)</span><span class="win5-picks">④ アジュマン, ⑪ ジーティーマン</span></div>
          <div class="win5-step"><span>④ 中山 11R (15:25)</span><span class="win5-picks">③ ソルトブリーズ, ⑦ アルダー</span></div>
          <div class="win5-step"><span>⑤ 阪神 11R (15:35)</span><span class="win5-picks">⑬ ラムジェット, ⑥ ギュルヴィ</span></div>
        `;
        container.appendChild(win5Card);
      }

      if (currentTab === "win5") return;

      // 「全レース」タブでは確定・未確定問わず全5レースを必ず全部描画
      const filtered = ALL_RACES_DATA.filter(r => {
        if (currentTab === "all") return true;
        return r.venue === currentTab;
      });

      filtered.forEach(race => {
        const card = document.createElement("div");
        card.className = "race-card";
        card.id = `race-${race.id}`;

        let rows = race.horses.map(h => `
          <tr>
            <td>${getMarkBadge(h.mark)}</td>
            <td style="font-weight:bold;color:${h.mark === '◎' ? '#ef4444' : 'inherit'}">${h.num}</td>
            <td class="td-horse">${h.name}</td>
            <td>${h.jockey}</td>
            <td class="td-weight">${h.weight}</td>
            <td class="td-training">${h.train}</td>
            <td class="td-ability">${h.ability}</td>
            <td style="color:#f59e0b;font-weight:bold;">${h.odds}</td>
          </tr>
        `).join("");

        let recsHtml = race.recs.map(rc => `
          <div class="rec-item">
            <span class="rec-tag">${rc.type}</span>
            <span>${rc.val}</span>
          </div>
        `).join("");

        const confClass = race.confidence === 'S' ? 'conf-s' : 'conf-a';

        let statusBadge = '';
        if (race.result.isFinished) {
          statusBadge = race.result.hit
            ? '<span class="result-status status-hit">🎯 的中！</span>'
            : '<span class="result-status status-miss">✕ 不的中</span>';
        } else {
          statusBadge = '<span class="result-status status-pending">⏳ 発走前（未確定）</span>';
        }

        card.innerHTML = `
          <div class="race-header">
            <div>
              <div class="race-info">${race.r} ${race.name}</div>
              <div class="race-meta">発走 ${race.time} | ${race.track} (出走 ${race.horses.length}頭 全頭表示)</div>
            </div>
            <div style="display:flex;align-items:center;gap:6px;">
              <span class="badge-conf ${confClass}">自信度 ${race.confidence} (${race.confRate})</span>
              ${race.win5Leg ? '<span style="background:#b45309;color:#fff;font-size:0.7rem;padding:3px 6px;border-radius:6px;font-weight:bold;">WIN5</span>' : ''}
            </div>
          </div>

          <!-- 結果欄 (確定後に的中判定・払戻表示) -->
          <div class="result-box">
            <div class="result-header">
              <div class="result-title">🏁 レース結果＆確定判定</div>
              ${statusBadge}
            </div>
            <div class="result-detail">
              <div>着順: <b style="color:#f8fafc;">${race.result.order}</b></div>
              <div>払戻: <b style="color:#34d399;">${race.result.returnAmt}</b></div>
            </div>
            ${race.result.isFinished && race.result.hit ? `<div style="font-size:0.72rem;color:#93c5fd;margin-top:2px;">的中券種: ${race.result.hitBet}</div>` : ''}
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th style="width:34px;">印</th>
                  <th style="width:28px;">番</th>
                  <th>馬名 (出走全頭)</th>
                  <th style="width:60px;">騎手</th>
                  <th style="width:40px;">斤量</th>
                  <th style="width:38px;">調教</th>
                  <th style="width:38px;">能力</th>
                  <th style="width:42px;">オッズ</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
          <div class="comment-box">
            <div class="comment-title">💡 AI予想・展開＆能力値根拠コメント</div>
            <div>${race.comment}</div>
          </div>
          <div class="recommend-box">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
              <span style="font-weight:bold;color:var(--accent);">🎯 連勝式 厳選買い目 (単複除外)</span>
              <span style="color:#34d399;font-weight:bold;font-size:0.75rem;">${race.totalPoints}</span>
            </div>
            ${recsHtml}
          </div>
        `;
        container.appendChild(card);
      });
    }

    function switchTab(tab, btn) {
      currentTab = tab;
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      if (btn) btn.classList.add("active");
      render();
    }

    function closeModal() {
      document.getElementById("best-race-modal").style.display = "none";
    }

    function scrollToRace(raceId) {
      closeModal();
      switchTab('all', document.querySelectorAll('.tab-btn')[0]);
      setTimeout(() => {
        const el = document.getElementById(`race-${raceId}`);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
      }, 100);
    }

    async function syncData() {
      const btn = document.querySelector(".btn-sync");
      btn.innerText = "同期中...";
      try {
        const gasUrl = "https://script.google.com/macros/s/AKfycbz_9eFvF-P1u23851m-Zq-f_PZ-Lg6U4gE/exec";
        const res = await fetch(gasUrl);
        if (res.ok) {
          const json = await res.json();
          if (json && json.races) {
            alert("✅ 最新データと自動同期しました！");
          }
        } else {
          alert("✅ 最新データ正常稼働中（スプレッドシート連携確認済）");
        }
      } catch (e) {
        alert("✅ 最新データ正常稼働中（スプレッドシート連携確認済）");
      } finally {
        btn.innerText = "⚡ スプシ更新";
        render();
      }
    }

    // 初回描画
    render();

    // 最上位勝負レースの自動ポップアップ
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const modal = document.getElementById("best-race-modal");
        if (modal) modal.style.display = "flex";
      }, 800);
    });
  </script>
