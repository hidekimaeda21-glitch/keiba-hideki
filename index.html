<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KEIBA AI PRO</title>
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  <style>
    body { background-color: #0b0f19; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    .horse-row:nth-child(even) { background-color: rgba(255, 255, 255, 0.03); }
  </style>
</head>
<body class="pb-20 max-w-md mx-auto min-h-screen flex flex-col">

  <header class="sticky top-0 z-40 bg-slate-900/95 backdrop-blur border-b border-slate-800 p-3 shadow-lg">
    <div class="flex justify-between items-center mb-2">
      <h1 class="text-base font-black text-amber-400">KEIBA AI PRO</h1>
      <span class="px-2 py-0.5 rounded text-[10px] bg-indigo-500/20 text-indigo-400 font-bold border border-indigo-500/30">✨ Gemini頭脳連携</span>
    </div>

    <!-- 通算成績ダッシュボード -->
    <div id="stats-card" class="mb-2 p-2.5 rounded-lg bg-slate-950 border border-slate-800 flex justify-around text-center shadow-inner">
      <div>
        <div class="text-[9px] text-slate-400">的中率</div>
        <div id="hit-rate" class="text-sm font-black text-emerald-400 font-mono">--%</div>
      </div>
      <div class="border-r border-slate-800"></div>
      <div>
        <div class="text-[9px] text-slate-400">回収率</div>
        <div id="return-rate" class="text-sm font-black text-amber-400 font-mono">--%</div>
      </div>
      <div class="border-r border-slate-800"></div>
      <div>
        <div class="text-[9px] text-slate-400">通算戦績</div>
        <div id="record-summary" class="text-[11px] font-bold text-slate-300 font-mono mt-0.5">--戦--勝</div>
      </div>
    </div>

    <p id="last-update" class="text-[10px] text-slate-400 font-mono mb-2">● 最終更新: 読込中...</p>
    <div id="venue-tabs" class="flex gap-2"></div>
  </header>

  <main id="race-container" class="p-3 flex-1 space-y-4">
    <div class="text-center text-xs text-slate-500 py-10">データを読み込んでいます...</div>
  </main>

  <script>
    let allRaces = [];
    let currentVenue = "";

    async function loadData() {
      try {
        // 成績データの読み込み
        try {
          const hRes = await fetch('./data/history.json?t=' + Date.now());
          if (hRes.ok) {
            const hData = await hRes.json();
            const invest = hData.totalInvest || 0;
            const payout = hData.totalPayout || 0;
            const total = hData.totalRaces || 0;
            const hits = hData.hitRaces || 0;

            const hitRate = total > 0 ? ((hits / total) * 100).toFixed(1) : "0.0";
            const returnRate = invest > 0 ? ((payout / invest) * 100).toFixed(1) : "0.0";

            document.getElementById('hit-rate').textContent = `${hitRate}%`;
            document.getElementById('return-rate').textContent = `${returnRate}%`;
            document.getElementById('record-summary').textContent = `${total}戦${hits}勝`;
          }
        } catch (e) {
          console.log("History fetch error:", e);
        }

        // 本日のレース予想読み込み
        const res = await fetch('./data/today.json?t=' + Date.now());
        if (!res.ok) throw new Error("データがありません");
        const data = await res.json();

        document.getElementById('last-update').textContent = `● 最終更新: ${data.updatedAt}`;
        allRaces = data.races;

        const venues = [...new Set(allRaces.map(r => r.venue))];
        renderTabs(venues);
        selectVenue(venues[0]);
      } catch (err) {
        document.getElementById('race-container').innerHTML = `
          <div class="bg-red-950/60 border border-red-800 p-4 rounded-xl text-center text-xs text-red-300">
            データがまだ生成されていません。ActionsのRun workflowを実行してください。
          </div>`;
      }
    }

    function renderTabs(venues) {
      const container = document.getElementById('venue-tabs');
      container.innerHTML = venues.map(v => `
        <button onclick="selectVenue('${v}')" id="tab-${v}" class="flex-1 py-1.5 rounded-lg text-xs font-bold bg-slate-800 text-slate-400 transition-all">
          ${v}
        </button>
      `).join('');
    }

    function selectVenue(v) {
      currentVenue = v;
      document.querySelectorAll('#venue-tabs button').forEach(b => {
        b.className = "flex-1 py-1.5 rounded-lg text-xs font-bold bg-slate-800 text-slate-400";
      });
      const activeBtn = document.getElementById(`tab-${v}`);
      if (activeBtn) activeBtn.className = "flex-1 py-1.5 rounded-lg text-xs font-bold bg-amber-500 text-slate-950 shadow";

      renderRaces();
    }

    function renderRaces() {
      const filtered = allRaces.filter(r => r.venue === currentVenue);
      const container = document.getElementById('race-container');

      container.innerHTML = filtered.map(race => {
        const rows = race.horses.map(h => `
          <div class="flex items-center p-2 border-b border-slate-800/60 horse-row text-xs">
            <span class="w-6 font-bold text-amber-400">${h.num}</span>
            <div class="flex-1">
              <div class="text-white font-bold">${h.name}</div>
              <div class="text-[10px] text-slate-400">${h.jockey} <span class="text-slate-500 font-mono">(${h.recent || '-'})</span></div>
            </div>
            <span class="w-14 text-right font-mono text-slate-300 mr-2">${h.odds > 0 ? h.odds + '倍' : '-'}</span>
            <span class="w-14 text-right font-bold ${h.mark.includes('◎') ? 'text-emerald-400' : h.mark.includes('○') ? 'text-amber-400' : h.mark.includes('☆') ? 'text-yellow-300' : 'text-slate-400'}">${h.mark}</span>
          </div>
        `).join('');

        const aiBlock = race.aiSummary ? `
          <div class="mb-3 p-3 rounded-lg bg-gradient-to-r from-indigo-950/60 to-slate-900 border border-indigo-800/50 shadow-inner">
            <div class="flex items-center gap-1.5 mb-1.5 text-indigo-400 font-bold text-xs">
              <span>🧠 ジェミ予想 AI見解</span>
            </div>
            <p class="text-xs text-slate-200 leading-relaxed mb-2">${race.aiSummary}</p>
            <div class="text-[11px] bg-slate-950/60 p-2 rounded border border-indigo-900/40 text-amber-300 font-mono">
              <span class="text-slate-400">推奨買い目:</span> ${race.aiBuy || 'オッズ確定後算出'}
            </div>
          </div>
        ` : '';

        return `
          <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 shadow-md">
            <div class="flex justify-between items-center mb-2">
              <h2 class="text-xs font-bold text-white">${race.venue} ${race.raceName}</h2>
              <span class="text-[10px] text-slate-400 font-mono">${race.startTime} 発走</span>
            </div>
            ${aiBlock}
            <div class="rounded-lg overflow-hidden border border-slate-800/80 bg-slate-950/40">
              ${rows}
            </div>
          </div>
        `;
      }).join('');
    }

    loadData();
  </script>
</body>
</html>
