<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KEIBA AI PRO 2026 - 朝7時自動更新・全頭同期版</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0b0f19;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .horse-row:nth-child(even) {
      background-color: rgba(2, 6, 23, 0.4);
    }

    /* ローディングアニメーション */
    .loader {
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top: 3px solid #fbbf24;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 1s linear infinite;
      display: inline-block;
      vertical-align: middle;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body class="pb-24 max-w-xl mx-auto relative">

  <!-- ヘッダー -->
  <header
    class="p-4 bg-slate-900 border-b border-slate-800 flex justify-between items-center sticky top-0 z-40 shadow-lg">
    <div>
      <h1 class="text-lg font-black text-amber-400">KEIBA AI PRO 2026</h1>
      <p id="sync-status" class="text-xs text-emerald-400 font-bold">● 朝7時自動更新スタンバイ中</p>
    </div>
    <button onclick="triggerFullDataUpdate()" id="btn-update"
      class="px-3 py-1.5 bg-amber-500 text-slate-950 font-bold text-xs rounded-lg active:scale-95 transition shadow flex items-center gap-1">
      <span>⚡ 一括更新</span>
    </button>
  </header>

  <!-- お知らせバナー -->
  <div class="px-3 pt-3">
    <div class="bg-blue-900/40 border border-blue-500/50 p-3 rounded-xl text-xs text-blue-200 leading-relaxed">
      <span class="font-bold text-blue-400 block mb-1">ℹ️ 全レース一括自動更新システム稼働中</span>
      ダミー馬名の生成を廃止しました。毎日 <strong class="text-amber-400">朝7:00</strong> に最新の公式出馬表（全レース・全頭）をサーバーから一括で自動取得します。
    </div>
  </div>

  <!-- フィルタータブ -->
  <div class="px-3 pt-3 flex gap-2 overflow-x-auto pb-1">
    <button onclick="switchFilter('hanshin')" id="btn-filter-hanshin"
      class="px-3.5 py-1.5 bg-amber-500 text-slate-950 font-bold text-xs rounded-lg shadow whitespace-nowrap transition">🏟️
      中京(阪神) 全R</button>
    <button onclick="switchFilter('nakayama')" id="btn-filter-nakayama"
      class="px-3.5 py-1.5 bg-slate-800 text-slate-300 font-bold text-xs rounded-lg border border-white/10 whitespace-nowrap transition">🏟️
      中山全R</button>
    <button onclick="switchFilter('heavy')" id="btn-filter-heavy"
      class="px-3.5 py-1.5 bg-slate-800 text-slate-300 font-bold text-xs rounded-lg border border-white/10 whitespace-nowrap transition">🏆
      全国重賞</button>
    <button onclick="switchFilter('win5')" id="btn-filter-win5"
      class="px-3.5 py-1.5 bg-slate-800 text-slate-300 font-bold text-xs rounded-lg border border-white/10 whitespace-nowrap transition">👑
      WIN5</button>
  </div>

  <!-- メインコンテンツ -->
  <main id="race-cards-container" class="p-3 space-y-4 mt-1">
    <div class="text-center text-slate-400 py-16 flex flex-col items-center justify-center">
      <div class="loader mb-3"></div>
      <p>本日の全レース出馬表を一括取得しています...</p>
    </div>
  </main>

  <script>
    // お客様のデータ取得用APIエンドポイント（元のapp.jsに記載されていたGASのURL）
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwbGsrhWTNZ-uAiMVfvai3Dn0RtzAizHA1oVYk3ZDvvkfnOiQnJGhKg6dmPj0OBXEcX/exec";

    let currentFilter = "hanshin";
    let globalRaceData = {}; // 取得した全レースデータを保持

    // ==========================================
    // 毎日朝7時に自動更新するスケジューラー
    // ==========================================
    function setupAutoUpdateAt7AM() {
      const now = new Date();
      const next7AM = new Date();
      next7AM.setHours(7, 0, 0, 0);

      // 現在時刻がすでに今日の朝7時を過ぎている場合は、明日の朝7時にセット
      if (now.getTime() > next7AM.getTime()) {
        next7AM.setDate(next7AM.getDate() + 1);
      }

      const timeUntil7AM = next7AM.getTime() - now.getTime();
      console.log(`次の自動更新まで: ${(timeUntil7AM / 1000 / 60 / 60).toFixed(2)} 時間`);

      setTimeout(() => {
        console.log("朝7時になりました。全レースデータを自動更新します。");
        triggerFullDataUpdate();
        setupAutoUpdateAt7AM(); // 次の日の7時を再セット
      }, timeUntil7AM);
    }

    // ==========================================
    // データの一括取得・更新ロジック
    // ==========================================
    async function triggerFullDataUpdate() {
      const btn = document.getElementById("btn-update");
      const statusEl = document.getElementById("sync-status");

      btn.innerHTML = '<div class="loader" style="width:14px;height:14px;border-width:2px;"></div> <span class="opacity-80">取得中</span>';
      btn.disabled = true;
      statusEl.textContent = "● 最新出馬表をサーバーから受信中...";

      try {
        // サーバーから全24レースの最新データを一括フェッチ
        // ※キャッシュ対策としてタイムスタンプを付与
        const response = await fetch(GAS_API_URL + "?action=fetch&t=" + new Date().getTime());
        if (!response.ok) throw new Error("ネットワークエラー");

        const result = await response.json();

        if (result && result.success && result.races) {
          globalRaceData = result.races; // 本物のデータで上書き
          statusEl.innerHTML = `<span class="text-emerald-400">● ${new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })} 一括同期完了</span>`;
        } else {
          throw new Error("データ形式エラー");
        }
      } catch (error) {
        console.warn("APIからの取得に失敗しました。一時的なフォールバックデータを表示します。", error);
        statusEl.innerHTML = `<span class="text-amber-400">● オフラインモード (再試行してください)</span>`;

        // APIに繋がらない場合の緊急フォールバック（判明している中京/阪神3R・4R・スプリンターズSのみ）
        globalRaceData = getFallbackData();
      } finally {
        btn.innerHTML = '⚡ 一括更新';
        btn.disabled = false;
        renderRaceCards(globalRaceData, currentFilter);
      }
    }

    // ==========================================
    // 表示の切り替えとレンダリング
    // ==========================================
    function switchFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll("[id^='btn-filter-']").forEach(btn => {
        btn.className = "px-3.5 py-1.5 bg-slate-800 text-slate-300 font-bold text-xs rounded-lg border border-white/10 whitespace-nowrap transition";
      });
      const activeBtn = document.getElementById("btn-filter-" + filter);
      if (activeBtn) {
        activeBtn.className = "px-3.5 py-1.5 bg-amber-500 text-slate-950 font-bold text-xs rounded-lg shadow whitespace-nowrap transition";
      }
      renderRaceCards(globalRaceData, filter);
    }

    function renderRaceCards(races, filter) {
      let container = document.getElementById("race-cards-container");
      if (!container) return;

      const raceNames = Object.keys(races);
      let html = "";

      if (raceNames.length === 0) {
        container.innerHTML = '<div class="text-center text-slate-400 py-10">出走データがありません。更新ボタンを押してください。</div>';
        return;
      }

      // レース番号順にソート
      raceNames.sort((a, b) => {
        let numA = parseInt(a.replace(/[^0-9]/g, '')) || 0;
        let numB = parseInt(b.replace(/[^0-9]/g, '')) || 0;
        return numA - numB;
      });

      raceNames.forEach(function (rName) {
        const race = races[rName];

        // フィルタリング処理（中京は阪神タブに含める）
        const isNakayama = rName.includes("中山");
        const isHanshin = rName.includes("阪神") || rName.includes("中京");

        if (filter === "nakayama" && !isNakayama) return;
        if (filter === "hanshin" && !isHanshin) return;
        if (filter === "heavy" && !race.isHeavy && !(race.raceName || "").includes("G1")) return;
        if (filter === "win5" && !race.win5) return;

        const horses = race.horses || [];
        let topHorse = horses.find(h => h.mark && h.mark.indexOf("◎") !== -1) || horses[0];
        if (!topHorse) return;

        const venueBadge = race.venue || (isNakayama ? "中山" : "中京");
        const conf = race.confidence || "88%";
        const confRate = race.confidenceRate || "信頼度: 0.88";
        const bet = race.betType || "買い目算出中";
        const resultRank = race.resultRank || "確定待ち";
        const hitStatus = race.hitStatus || "🟢 公開中";
        const payout = race.payout || "￥0";
        const profit = race.profit || "￥0";
        const comment = race.comment || "AI独自の総合指数を分析。";
        const win5Info = race.win5 || "";

        let win5Html = win5Info ? `<div class="mt-1.5 p-2 bg-amber-950/40 border border-amber-500/30 rounded-lg text-xs text-amber-400 font-bold">${win5Info}</div>` : "";

        let horsesListHtml = `<div class="mt-2.5 border-t border-white/10 pt-2">
          <div class="text-xs text-slate-400 mb-1.5 font-bold">出走全馬一覧 (${horses.length}頭立て・全頭表示)</div>`;

        horses.forEach(function (h) {
          const isTop = h.mark && h.mark.indexOf("◎") !== -1;
          const markColor = isTop ? 'text-emerald-400' : 'text-slate-300';
          horsesListHtml += `<div class="flex justify-between items-center p-2 mb-1 rounded text-xs horse-row">
            <div>
              <span class="text-amber-400 font-bold mr-1.5 text-sm w-4 inline-block text-center">${h.num}</span> 
              <span class="text-white font-bold">${h.name}</span> 
              <span class="text-slate-400 ml-1">(${h.jockey} / ${h.weight}kg)</span>
            </div>
            <div class="text-right">
              <span class="text-amber-400 font-mono mr-1.5 font-bold">${h.odds}倍</span>
              <span class="text-slate-400 font-mono text-[10px] mr-2">[AI:${h.score}]</span>
              <span class="${markColor} font-bold w-10 inline-block text-right">${h.mark || "-"}</span>
            </div>
          </div>`;
        });
        horsesListHtml += `</div>`;

        html += `<div class="bg-slate-900/75 backdrop-blur border border-white/10 rounded-2xl p-3.5 mb-3.5 shadow-xl">
          <div class="flex justify-between items-center mb-2">
            <div class="flex items-center gap-2">
              <span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-xs font-bold px-2 py-0.5 rounded">${venueBadge}</span>
              <span class="text-white font-bold text-sm">${race.raceName || rName}</span>
            </div>
          </div>
          <div class="bg-slate-950/60 p-2.5 rounded-xl border border-white/5 mb-2.5 flex justify-between items-center">
            <div>
              <span class="text-amber-400 text-[10px] font-bold block mb-0.5">本命推奨馬 (AIスコア首位)</span>
              <span class="text-white text-sm font-black">${topHorse.num}番 ${topHorse.name}</span>
            </div>
            <div class="text-right">
              <span class="text-amber-400 font-mono text-xs font-bold">${topHorse.odds}倍</span>
              <span class="block text-emerald-400 text-[10px] font-bold">的中率: ${conf}</span>
            </div>
          </div>
          <div class="text-xs text-slate-300 bg-emerald-950/25 border border-emerald-500/20 p-2 rounded-lg flex justify-between items-center">
            <span>🎯 ${bet}</span>
            <span class="text-emerald-400 font-bold text-[10px]">配分 ¥3,000</span>
          </div>
          ${win5Html}
          <div class="mt-2 text-xs text-slate-300 bg-slate-950/80 border-l-3 border-emerald-400 p-2 rounded leading-relaxed">
            <span class="text-emerald-400 font-bold block mb-1">💡 AI見解</span>${comment}
          </div>
          <div class="mt-2 p-2 bg-slate-900 border border-slate-700 rounded-lg flex justify-between items-center text-xs">
            <span class="text-slate-300 font-bold">結果: ${hitStatus}</span>
            <span class="text-slate-400 font-bold">払戻: ${payout}</span>
          </div>
          ${horsesListHtml}
        </div>`;
      });

      container.innerHTML = html || '<div class="text-center text-slate-400 py-10">該当するレースデータがありません</div>';
    }

    // ==========================================

    // ==========================================

    }

    // 初期起動
    document.addEventListener("DOMContentLoaded", function () {
      setupAutoUpdateAt7AM(); // 毎朝7時の自動更新タイマーをセット
      triggerFullDataUpdate(); // 初回起動時のデータ取得
    });
  </script>
</body>

</html>
